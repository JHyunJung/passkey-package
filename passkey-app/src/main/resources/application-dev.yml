# dev profile — 로컬 개발자 환경
#
# 활성화: SPRING_PROFILES_ACTIVE=dev ./gradlew :passkey-app:bootRun \
#         --args="--passkey.id-token.issuer-base=http://localhost:8080"
#
# 포함: localhost Oracle/Redis + PSK_APP_RUNTIME_USER credential + dev key-envelope
#       master + DEBUG 로깅
#
# 기존 local / local-shared 가 흡수됨 — 더 이상 spring.config.import chain 사용 안 함.
#
# 아래 값들은 로컬 기본값이다. dev 프로필을 서버에 배포한다면 같은 이름의
# 환경변수(SPRING_DATASOURCE_URL 등)로 주입해 덮어쓴다.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${SPRING_DATASOURCE_USERNAME:PSK_APP_RUNTIME_USER}
    password: ${SPRING_DATASOURCE_PASSWORD:runtime_pw}
  data:
    redis:
      host: localhost
      port: 6379

passkey:
  key-envelope:
    # NON-SECRET, dev only — admin-app 과 동일 값이어야 한다(같은 DB 의 signing key 를
    # 양쪽이 공유하므로 master-key 불일치 시 복호화 실패). prod 는 환경변수로 주입.
    master-key: ${PASSKEY_KEY_ENVELOPE_MASTER_KEY:jDKp21WXeDAwinZI91Hf+8L2zv4xlIQI15YPLhttyYM=}

logging:
  level:
    com.crosscert.passkey: DEBUG
    org.hibernate.SQL: DEBUG
