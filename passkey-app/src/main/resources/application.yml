spring:
  application.name: passkey-app
  config.import: classpath:application-common.yml
  flyway.enabled: false

server:
  port: 8080
  # F-ratelimitProxy: prod 토폴로지는 앞단 LB/리버스프록시가 요청을 전달한다
  # (docs/single-instance-deployment.md §3.1). forward-headers-strategy 가
  # NONE(기본값)이면 request.getRemoteAddr() 가 프록시 TCP peer(예: 127.0.0.1)
  # 만 보고 X-Forwarded-For 를 무시 — RateLimitFilter 의 IP 버킷
  # (ratelimit:<path>:ip:<remoteAddr>) 이 모든 클라이언트에 대해 동일한 키로
  # 붕괴해 rate-limit 이 전체 트래픽을 한 버킷에 몰아넣는다(정상 사용자
  # 상호 429 + IP 스프레이 공격자에 대한 방어 무력화). FRAMEWORK 로 켜면
  # Spring 의 ForwardedHeaderFilter 가 신뢰할 수 있는 X-Forwarded-For 헤더를
  # 반영해 RateLimitFilter 코드 변경 없이 실제 클라이언트 IP 로 버킷이
  # 분리된다. admin-app 과 동일한 방식(commit 44cb1fe8, G13). dev/local 처럼
  # 프록시가 없는 환경은 헤더 자체가 없으니 안전한 no-op.
  forward-headers-strategy: framework

management:
  metrics:
    tags:
      application: passkey-app

passkey:
  alert:
    mail:
      enabled: false        # true 면 MailAlertChannel 등록, ops 메일 발송
      to:                   # 알림 수신 운영자 주소
      min-severity: HIGH    # 이 severity 이상만 메일(LOW/MEDIUM/HIGH/CRITICAL). 기본 LogAlertChannel 은 전 severity 로깅
