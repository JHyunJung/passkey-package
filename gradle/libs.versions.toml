[versions]
# Boot 4 모듈(core·webauthn·passkey-app·admin-app·rp-app) 의 BOM + Gradle 플러그인 버전.
spring-boot = "4.1.2"
# sdk-java 전용 BOM — 외부 RP 배포 라이브러리라 Spring 6 / Jackson 2 로 컴파일한다.
spring-boot-sdk = "3.5.16"
# Spring Boot 4.1.2 Gradle 플러그인이 runtime 의존하는 버전과 일치.
spring-dep-mgmt = "1.1.7"
webauthn4j = "0.31.5.RELEASE"
nimbus-jose-jwt = "9.40"
tink = "1.13.0"
bucket4j = "8.18.0"
wiremock = "3.10.0"
archunit = "1.3.0"
lombok = "1.18.34"
# passkey-app 만 Kotlin. Boot 4 BOM 의 kotlin.version(4.1.2: 2.3.21)을 루트 build.gradle.kts 에서
# 이 값으로 덮어써 kotlin-stdlib/kotlin-reflect 를 컴파일러와 같은 버전으로 맞춘다.
kotlin = "2.4.21"
# Maven Central 최신 6.x(2026-11 기준 6.4.0) — mockito-core 5.23.0 의존 = Boot 4.1.2 BOM mockito.version 과 일치.
mockito-kotlin = "6.4.0"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc11" }
# NLS(National Language Support) — Oracle 문자셋/날짜·언어 변환 등에 필요. ojdbc 와 동일 버전(Boot BOM oracle-database.version).
oracle-nls = { module = "com.oracle.database.nls:orai18n" }
# Flyway·Oracle JDBC·Testcontainers 는 Spring Boot BOM 이 버전 관리(4.1.2: flyway 12.4.0, oracle-database 23.26.3.0.0, testcontainers 2.0.5).
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-oracle = { module = "org.flywaydb:flyway-database-oracle" }
# Testcontainers 2.x 아티팩트명(testcontainers- 접두사).
testcontainers-oracle = { module = "org.testcontainers:testcontainers-oracle-xe" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
webauthn4j-core = { module = "com.webauthn4j:webauthn4j-core", version.ref = "webauthn4j" }
webauthn4j-test = { module = "com.webauthn4j:webauthn4j-test", version.ref = "webauthn4j" }
webauthn4j-metadata = { module = "com.webauthn4j:webauthn4j-metadata", version.ref = "webauthn4j" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
bucket4j-redis = { module = "com.bucket4j:bucket4j_jdk17-lettuce", version.ref = "bucket4j" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-session-data-redis = { module = "org.springframework.session:spring-session-data-redis" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version = "8.0" }
# Kotlin(passkey-app). jackson-module-kotlin 은 Jackson 3 좌표 — 버전은 Boot BOM(jackson-bom) 관리.
# kotlin-reflect 버전은 Boot BOM kotlin.version(루트에서 2.4.21 로 덮어씀) 관리.
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dep-mgmt = { id = "io.spring.dependency-management", version.ref = "spring-dep-mgmt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
