spring:
  # Boot 4 / Jackson 3 자동설정. 직렬화 계약은 Boot 3(Jackson 2) 와 동일하게 유지한다.
  jackson:
    # Boot 4.1: Jackson 3 를 Boot 가 예전 Jackson 2 에 쓰던 기본값으로 구성
    # (MapperBuilder.configureForJackson2() — 프로퍼티 알파벳 정렬 끔, null→primitive 허용,
    # 후행 토큰 허용, enum toString 미사용 등 — + 날짜/기간 timestamp 끔 등 Boot 2/3 기본값).
    # 덮지 않는 나머지 차이는 CoreJacksonConfig 가 명시.
    use-jackson2-defaults: true
    datatype:
      datetime:
        # Jackson 3 에서 WRITE_DATES_AS_TIMESTAMPS 는 SerializationFeature → DateTimeFeature 로 이동.
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null
    # 파서/제너레이터 상한을 Jackson 2(2.21) 기본값으로 되돌린다 — Boot 4 기본은 중첩 500·문자열 100MB.
    # passkey-app 은 PasskeyAppJacksonConfig 가 이보다 좁힌다(중첩 64·문자열 256KB·문서 1MB).
    factory:
      constraints:
        read:
          max-nesting-depth: 1000
          max-string-length: 20000000
        write:
          max-nesting-depth: 1000
  jpa:
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
      hibernate.jdbc.time_zone: Asia/Seoul
      # The app connects as PSK_APP_RUNTIME_USER (passkey) or PSK_APP_ADMIN_USER
      # (admin). All entity tables live in PSK_APP_OWNER schema, so Hibernate
      # must validate and issue DML against PSK_APP_OWNER, not the login
      # user's default schema. This mirrors Flyway's default-schema
      # setting (admin-app application.yml).
      hibernate.default_schema: ${passkey.db.schema}
      # Phase QW-3: JDBC 배치 + 배치 페치 사이징.
      # batch_size: 같은 flush 에 쌓인 동종 INSERT/UPDATE 를 30개 단위로 한 번에
      #   JDBC 전송 — 라운드트립만 줄고 DML 결과는 불변.
      # default_batch_fetch_size: LAZY 연관(예: Tenant.allowedOrigins/acceptedFormats)
      #   접근 시 N개 부모를 IN(...) 16개 묶음으로 페치 — 결과 동일, 쿼리 횟수만 감소.
      # order_inserts/order_updates 는 의도적으로 제외: flush DML 순서를 전역
      #   재배열하면 TenantAdminService.replaceAllowedOrigins/replaceAcceptedFormats
      #   가 의존하는 "DELETE 먼저 flush 후 INSERT"(Oracle unique 제약 회피, em.flush()
      #   로 명시 제어 중인 경로) 등 미감사 write 경로의 순서 제약을 깰 위험 → risk=low
      #   별도 판단 항목으로 유보.
      hibernate.jdbc.batch_size: 30
      hibernate.default_batch_fetch_size: 16
    hibernate.ddl-auto: validate
  datasource:
    hikari:
      # P6: 앱별 기본값은 passkey.db.pool-max-default 로 정한다(미설정 앱은 10 — admin-app).
      # passkey-app 은 application.yml 에서 20 으로 두고 server.tomcat.threads.max 를 이 값 − 1(19)로
      # 묶는다. 이 파일은 import 되는 쪽이라 앱 yml 의 같은 키보다 우선하므로, 앱별 값은
      # 이 키가 아니라 placeholder 의 기본값 속성으로 넘긴다. 풀을 바꾸면 워커 상한도 함께 바꾼다.
      # minimum-idle 은 그대로 2 — 상한만 올라가고 유휴 세션 수는 불변.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE:${passkey.db.pool-max-default:10}}
      minimum-idle: 2
      pool-name: passkey-pool
      connection-init-sql: "ALTER SESSION SET TIME_ZONE='Asia/Seoul'"
  data:
    redis:
      lettuce:
        pool:
          enabled: true
          max-active: 8

management:
  # 무인증 health 는 status 만 — DB·Redis 구성 요소 상세는 인증된 요청에만(admin-app 운영자).
  # passkey-app 은 Spring Security 가 없어 사실상 항상 숨김. compose healthcheck 는 "UP" 문자열만 본다.
  # 로컬에서 상세가 필요하면 env MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=always.
  endpoint.health.show-details: when-authorized
  endpoint.health.probes.enabled: true
  # prometheus 는 기본 비노출 — 스크레이프가 필요한 배포만 env
  # MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus 로 켠다
  # (passkey-app 은 Spring Security 가 없어 8080 에서 무인증이므로 기본 닫음).
  endpoints.web.exposure.include: health,info
  health:
    group:
      readiness:
        include: readinessState,db,redis
      liveness:
        include: livenessState

logging:
  level:
    root: INFO
    com.crosscert.passkey: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.connections: WARN
    com.zaxxer.hikari: WARN
    org.apache.tomcat: WARN
    io.lettuce: WARN

passkey:
  db:
    # 스키마 소유자 계정명. 계정명이 바뀌면 이 값(또는 PASSKEY_DB_SCHEMA)만 바꾼다.
    schema: ${PASSKEY_DB_SCHEMA:PSK_APP_OWNER}
  deployment:
    mode: saas
  # passkey.license.* 기본값은 LicenseProperties 레코드(단일 출처). 덮어쓰려면
  # PASSKEY_LICENSE_* env 또는 여기에 키를 추가한다(onprem 에서만 소비).
  mail:
    # 발신 주소. MailSenderConfiguration 의 SmtpMailSender 가 사용.
    # SMTP 활성화(spring.mail.host 설정) 시 의미 있음.
    from: ${PASSKEY_MAIL_FROM:no-reply@passkey.local}
