# dev profile — 로컬 개발자 환경
#
# 활성화: SPRING_PROFILES_ACTIVE=dev
#
# 포함: localhost Oracle/Redis + PSK_APP_ADMIN_USER credential + dev key-envelope
#       master + DEBUG 로깅 + db/seed-common(alice) + db/dev 시드(dev-passkey 테넌트)
#
# 기존 local / local-shared 가 흡수됨 — 더 이상 spring.config.import chain 사용 안 함.
#
# 아래 값들은 로컬 기본값이다. dev 프로필을 서버에 배포한다면 같은 이름의
# 환경변수(SPRING_DATASOURCE_URL 등)로 주입해 덮어쓴다.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${SPRING_DATASOURCE_USERNAME:PSK_APP_ADMIN_USER}
    password: ${SPRING_DATASOURCE_PASSWORD:admin_pw}
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    locations: classpath:db/migration,classpath:db/seed-common,classpath:db/dev

passkey:
  key-envelope:
    # NON-SECRET, dev only — 공개 상수이지만 '0키' 신호를 제거해 실수로
    # prod 에서 약한 키가 쓰이는 것을 식별하기 쉽게 한다. prod 는 환경변수로 주입.
    # Production sets PASSKEY_KEY_ENVELOPE_MASTER_KEY environment variable.
    master-key: ${PASSKEY_KEY_ENVELOPE_MASTER_KEY:jDKp21WXeDAwinZI91Hf+8L2zv4xlIQI15YPLhttyYM=}

logging:
  level:
    com.crosscert.passkey: DEBUG
    org.hibernate.SQL: DEBUG
