spring:
  application.name: admin-app
  config.import: classpath:application-common.yml
  # 스케줄러 스레드 풀 2 — daily RetentionPurgeJob 의 긴 배치 실행이 per-minute
  # KeyExpirationJob tick 을 단일 스레드에서 지연시키지 않도록(4개 @Scheduled job 공유).
  task:
    scheduling:
      pool:
        size: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 스키마명은 common yml 의 passkey.db.schema(=${PASSKEY_DB_SCHEMA:PSK_APP_OWNER})
    # 한 곳에서만 정한다. Hibernate 의 default_schema 도 같은 값을 참조하므로
    # Flyway 가 만드는 스키마와 JPA 가 조회하는 스키마가 갈라질 수 없다.
    # 단, 아래 spring.flyway.user 는 별도 값이다 — PASSKEY_DB_SCHEMA 만 바꾸면
    # 대상 스키마와 접속 계정이 갈라질 수 있으니 둘을 함께 바꾼다.
    schemas: ${passkey.db.schema}
    default-schema: ${passkey.db.schema}
    # Finding #3 (Approach A): Flyway runs as the schema OWNER, not the
    # runtime datasource user. This lets us strip ALL DDL power from the
    # runtime PSK_APP_ADMIN_USER while migrations still create/alter objects.
    # url is omitted → Flyway falls back to spring.datasource.url (same DB).
    user: ${SPRING_FLYWAY_USER:PSK_APP_OWNER}
    password: ${SPRING_FLYWAY_PASSWORD:app_owner_pw}
    # The PSK_APP_OWNER schema may already contain objects created by the
    # bootstrap schema script before Flyway ever runs. baseline-on-migrate
    # lets Flyway record V0 in its history table on first run instead of
    # refusing to start because the schema is "non-empty". V1+ migrations
    # apply normally afterwards.
    baseline-on-migrate: true
    baseline-version: 0

  session:
    timeout: PT30M
    redis:
      namespace: spring:session

server:
  port: 8081
  # G13/F-cookieSecure: prod 토폴로지는 앞단 LB/리버스프록시가 TLS 종단 후 앱에는
  # 평문 HTTP 로 전달한다(application-prod.yml 참고). forward-headers-strategy 가
  # NONE(기본값)이면 request.getRemoteAddr()/isSecure() 가 프록시 TCP peer/스킴만
  # 보고 X-Forwarded-For/-Proto 를 무시 — 감사 로그 IP 가 전부 LB IP로 찍히고
  # (G13), 세션/CSRF 쿠키의 Secure 자동판정(request.isSecure() 기반, 각 저장소
  # 기본 동작)도 항상 false 가 된다(F-cookieSecure). FRAMEWORK 로 켜면 Spring 의
  # ForwardedHeaderFilter 가 신뢰할 수 있는 X-Forwarded-* 헤더를 반영해 두 문제를
  # 함께 해결한다. dev/local 처럼 프록시가 없는 환경은 헤더 자체가 없으니 안전한
  # no-op(getRemoteAddr/isSecure 그대로) — 전 프로필 공통으로 켜도 무해하다.
  forward-headers-strategy: framework

management:
  metrics:
    tags:
      application: admin-app

passkey:
  mds:
    fixed-delay: PT6H
    initial-delay: PT30S
    # 어드민 UI 표시값 전용 — 실제 신뢰 판정은 검증 계층이 하고, 이 값은
    # MdsAdminController 가 현재 정책을 화면에 보여줄 때만 읽는다(동일 폴백).
    trust-mode: MDS_STRICT_OPTIONAL
  key-rotation:
    grace: PT30M
    expiration-job:
      fixed-delay: PT1M
      initial-delay: PT45S
  admin:
    lockout:
      max-attempts: 5      # 연속 실패 N회 시 계정 잠금
      duration: PT15M      # 잠금 지속 시간(ISO-8601); 경과 후 자동 해제
  api-key:
    rotation:
      grace: PT24H         # rotate 시 구 키 유예 만료(ISO-8601); 이 기간 구·신 키 병존 후 구 키 자동 만료
  alert:
    mail:
      enabled: false        # true 면 MailAlertChannel 등록, ops 메일 발송
      to:                   # 알림 수신 운영자 주소
      min-severity: HIGH    # 이 severity 이상만 메일(LOW/MEDIUM/HIGH/CRITICAL). 기본 LogAlertChannel 은 전 severity 로깅
  retention:
    fixed-delay: P1D            # 하루 1회 실행
    initial-delay: PT5M         # 부팅 후 5분
    signup-request: P90D        # 미처리 가입 요청 90일 (대기 상한 100 영구 점유 방지)
    password-reset-token: P30D  # 만료/소비 후 30일
    recovery-code: P180D        # 사용 후 180일
    webauthn-snapshot: P365D    # 스냅샷 1년
    mds-sync-history: P90D      # sync 이력 90일
    ceremony-event: P90D        # funnel 지표 90일 (funnel 조회는 최대 30일)
    credential-auth-event: P90D # 인증 이벤트 90일
