# prod profile — 프로덕션 환경 (SaaS 또는 on-prem)
#
# 활성화: SPRING_PROFILES_ACTIVE=prod
#         deployment.mode 와는 독립 — onprem 배포라면
#         + PASSKEY_DEPLOYMENT_MODE=onprem 추가
#
# 모든 시크릿과 환경 특화 값은 환경변수로 주입.

spring:
  datasource:
    url:               ${SPRING_DATASOURCE_URL:}
    driver-class-name: oracle.jdbc.OracleDriver
    username:          ${SPRING_DATASOURCE_USERNAME:}
    password:          ${SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  # SMTP 설정은 환경변수로만 주입한다 — 여기에 spring.mail.host 를 빈 default 로
  # 두면 안 된다. Spring Boot 의 @ConditionalOnProperty("spring.mail.host") 가
  # 빈 문자열도 "present" 로 보고 쓸모없는 JavaMailSender 빈과 mail health
  # indicator(actuator /health 의 DOWN)를 만들기 때문. 키를 생략하면:
  #   - SPRING_MAIL_HOST 미설정 → spring.mail.host 부재 → auto-config 미동작,
  #     MailSenderConfiguration 이 LogMailSender 선택(메일 미발송, 초대는 동작).
  #   - SPRING_MAIL_HOST 설정 → relaxed binding 으로 spring.mail.host 자동 인식,
  #     JavaMailSender auto-config 동작, SmtpMailSender 선택.
  # 실제 발송 시 함께 주입: SPRING_MAIL_PORT(미지정 시 JavaMail 기본 25;
  # STARTTLS 는 보통 587), SPRING_MAIL_USERNAME,
  # SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH,
  # SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE.

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        # F-cookieSecure: base application.yml 의 forward-headers-strategy=native
        # 가 request.isSecure() 를 X-Forwarded-Proto 기반으로 정확히 판정하게 만들어
        # Spring Session 쿠키 직렬화기(DefaultCookieSerializer)의 Secure 자동판정도
        # 이미 옳게 동작하지만, prod 는 명시적으로 강제해 방어심층을 추가한다(LB 설정
        # 실수로 헤더가 누락돼도 세션 쿠키가 평문 채널로 새지 않도록 fail-closed).
        secure: true
        same-site: lax

passkey:
  key-envelope:
    master-key: ${PASSKEY_KEY_ENVELOPE_MASTER_KEY:}

admin:
  invite:
    # 공개 페이지 base URL — 메일 본문의 링크 앞에 붙는다. 실제 admin 콘솔 주소(예: https://admin.example.com,
    # 로컬은 http://localhost:8081)를 넣는다. 기본값 :5173 은 실제로 쓰지 않는 주소다(설정 누락을 잡는 기동 검사용 표식).
    # 비밀번호 재설정(/reset-password?token=) 과 가입 승인 메일의 로그인 링크(/admin)
    # 가 이 값을 쓴다. /reset-password 는 콘솔이 쿼리를 보존해 /admin/reset-password 로 리다이렉트한다.
    # PasswordResetService·SignupRequestService 의 @Value("${admin.invite.base-url:...}") 가 읽는다. 속성 이름은 호환성 때문에 유지.
    base-url: ${ADMIN_INVITE_BASE_URL:http://localhost:5173}

logging:
  level:
    root: WARN
    com.crosscert.passkey: INFO
