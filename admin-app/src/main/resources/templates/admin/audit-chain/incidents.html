<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  보안 Incident(← AuditChainPage.tsx 의 사건 카드·생성/해결 다이얼로그). 조각:
    card(oob)   #chain-incidents 카드. oob=true 면 hx-swap-oob 로 이 카드만 교체(다이얼로그는 건드리지 않는다).
    dialogs     #chain-dialogs — 위변조 tenant 마다 "Incident 생성" + 공유 "Incident 해결" 다이얼로그 하나(대상은 해결 버튼의 data-* 로 정해 폼의 id 값으로 간다 —
                목록이 바뀌어도 다이얼로그 정의를 다시 그릴 필요가 없다).
    action(t,oob)  배너 행의 동작(생성 버튼 ↔ "Incident 처리 중"). oob=true 면 id(chain-act-{tid}) 로 그 요소만 교체.
    refresh     목록만 새로 읽은 응답(OOB): 카드 + 배너 동작 + incidentsKnown 알림. swap none.
    issue       다이얼로그 안 인라인 알림(HX-Retarget 슬롯) + 같은 OOB. 422 로 오므로 스왑된다(토스트 없음).
  요청 요소는 다이얼로그 밖(래퍼 div/form)이고 버튼은 ic-submit/rs-submit 이벤트만 올린다. 래퍼의 요청 상태는 reqBusy 다 — 안쪽 공유 dialog 컴포넌트가 자기 busy 를 가지므로
  다이얼로그 본문의 x-effect 가 reqBusy 를 dialog 의 busy 로 비춘다(진행 중 Escape·스크림·취소로 닫히지 않음, 원본 onClose={busy ? noop : onClose}).
  요청이 성공(2xx)하면 래퍼가 다이얼로그를 닫는다. 이름·메모·이메일은 th:text/data-* 로만.
  모델: incidentsKnown, incidentList(Incident), openCount/openLabel, emptyDesc, incidentColumns, incidentRetryAttrs, tamperedRows(Tampered), actionsOob
-->
<section th:fragment="card(oob)" class="card" id="chain-incidents" th:attr="hx-swap-oob=${oob == true} ? 'outerHTML'">
  <th:block th:replace="~{admin/fragments/ui/card :: cardHeader('보안 Incident', null, '위변조 감지 시 등록되는 대응 incident', ${openCount > 0} ? ~{:: openBadge} : null)}"></th:block>
  <!-- 목록 조회 실패는 "없음"으로 보이지 않게 한다(실제 OPEN incident 를 놓치지 않도록). 다시 시도는 개요 전체를 다시 읽는다(배너의 생성 버튼도 이 결과에 달려 있다). -->
  <div class="card__body" th:unless="${incidentsKnown}">
    <th:block th:replace="~{admin/fragments/ui/alert :: alert('bad', 'Incident 목록을 불러오지 못했습니다.', null, ~{:: retryButton}, null)}"></th:block>
  </div>
  <th:block th:if="${incidentsKnown and incidentList.isEmpty()}">
    <!-- 설명은 위변조 여부(root 의 data-tampered)로 정한다 — 목록만 새로 그리는 응답에서도 같은 문구가 되도록 클라이언트가 고른다. -->
    <div class="empty empty--compact">
      <img class="empty__art" th:src="@{/admin/img/all-clear.webp}" alt="">
      <p class="empty__title">등록된 incident가 없습니다</p>
      <p class="empty__sub" th:text="${emptyDesc}" x-text="$root.dataset.tampered === '1' ? '위변조 의심 tenant 는 위 배너에서 Incident 를 생성하세요.' : '모든 chain 이 정상입니다.'">모든 chain 이 정상입니다.</p>
    </div>
  </th:block>
  <th:block th:if="${incidentsKnown and !incidentList.isEmpty()}">
    <th:block th:replace="~{admin/fragments/ui/dataTable :: dataTable(${incidentColumns}, ~{:: incidentBody})}"></th:block>
  </th:block>
</section>

<div th:fragment="dialogs" id="chain-dialogs">
  <!-- Incident 생성: 위변조 tenant 마다. 서버가 재검증해 위변조 entry 를 기록한다 — 요청에는 tenantId 만 싣는다. -->
  <div th:each="t : ${tamperedRows}" th:if="${t.createId != null}" ui:attrs="${t.createAttrs}" hx-trigger="ic-submit" th:attr="data-dlg=${t.createId}, data-tid=${t.tenantId}"
       x-data="{ reqBusy: false }"
       x-on:dialog:close.window="if ($event.detail.id === $el.dataset.dlg) $nextTick(() => $nextTick(() => { if (!document.activeElement || document.activeElement === document.body) { const b = document.querySelector('#chain-act-' + $el.dataset.tid + ' button'); if (b) b.focus(); } }))"
       x-on:htmx:before-request="if ($event.detail.elt === $el) reqBusy = true"
       x-on:htmx:after-request="if ($event.detail.elt === $el) { reqBusy = false; if ($event.detail.successful) $dispatch('dialog:close', { id: $el.dataset.dlg }); }">
    <th:block th:replace="~{admin/fragments/ui/dialog :: dialog(${t.createId}, 'Incident 생성', ${t.name}, ~{:: icBody}, ~{:: icFooter}, null, null, null)}"></th:block>
  </div>

  <!-- Incident 해결: 공유 다이얼로그 하나. 메모 필수(공백뿐이면 해결 버튼 비활성), 열 때마다 대상·메모·"없는 incident" 상태 초기화. -->
  <form id="chain-resolve-form" ui:attrs="${resolveAttrs}" hx-trigger="rs-submit"
        x-data="{ rsId: '', rsLabel: '', note: '', gone: false, reqBusy: false }" x-on:submit.prevent
        x-on:resolve-open.window="rsId = $event.detail.id; rsLabel = $event.detail.label; note = ''; gone = false;" x-on:resolve-gone="gone = true"
        x-on:htmx:before-request="if ($event.detail.elt === $el) reqBusy = true"
        x-on:htmx:after-request="if ($event.detail.elt === $el) { reqBusy = false; if ($event.detail.successful) $dispatch('dialog:close', { id: 'chain-resolve' }); }">
    <th:block th:replace="~{admin/fragments/ui/dialog :: dialog('chain-resolve', 'Incident 해결', null, ~{:: rsBody}, ~{:: rsFooter}, null, null, null)}"></th:block>
  </form>
</div>

<!-- action: 배너 행의 동작. 생성 버튼은 목록을 확인하기 전(incidentsKnown=false)에는 비활성(원본: Incident 목록을 확인한 뒤 생성할 수 있습니다). -->
<span th:fragment="action(t, oob)" th:id="${'chain-act-' + (t.tenantId ?: 'platform')}" th:attr="hx-swap-oob=${oob == true} ? 'outerHTML'" style="display: contents">
  <span class="badge badge--warning badge--dot" th:if="${t.hasOpen}">Incident 처리 중</span>
  <button type="button" class="btn btn--sm btn--danger-solid" th:if="${!t.hasOpen and t.createId == null}" disabled th:title="${t.createTitle}">Incident 생성</button>
  <button type="button" class="btn btn--sm btn--danger-solid" th:if="${!t.hasOpen and t.createId != null}" th:disabled="${!t.canCreate}" th:title="${t.createTitle}"
          th:attr="data-dlg=${t.createId}" x-on:click="$dispatch('dialog:open', { id: $el.dataset.dlg })"
          x-bind:disabled="!incidentsKnown" x-bind:title="incidentsKnown ? null : 'Incident 목록을 확인한 뒤 생성할 수 있습니다'">Incident 생성</button>
</span>

<!-- refresh: 목록만 새로 읽은 응답(전부 OOB). -->
<th:block th:fragment="refresh">
  <th:block th:replace="~{:: oobParts}"></th:block>
</th:block>

<th:block th:fragment="oobParts">
  <th:block th:replace="~{:: card(true)}"></th:block>
  <th:block th:each="a : ${actionsOob}"><th:block th:replace="~{:: action(${a}, true)}"></th:block></th:block>
  <!-- 상태 전달은 OOB 싱크로: swap none 응답에서도 OOB 요소는 처리되고, 교체로 들어온 요소의 x-init 이 root 에 알린다. -->
  <span id="chain-known-sink" th:if="${incidentsKnown}" hidden hx-swap-oob="true" x-init="$dispatch('incidents-known', true)"></span>
  <span id="chain-known-sink" th:unless="${incidentsKnown}" hidden hx-swap-oob="true" x-init="$dispatch('incidents-known', false)"></span>
</th:block>

<!-- issue: 인라인 알림. gone 이면 root 에 "없는 incident" 를 알려 해결 버튼을 막는다. -->
<th:block th:fragment="issue">
  <th:block th:replace="~{admin/fragments/ui/alert :: alert(${issueTone}, ${issueTitle}, ~{:: issueText}, null, null)}"></th:block>
  <span th:if="${issueGone}" hidden x-init="$dispatch('resolve-gone')"></span>
  <th:block th:replace="~{:: oobParts}"></th:block>
</th:block>

<th:block th:remove="all">
  <th:block th:fragment="issueText"><th:block th:text="${issueText}">설명</th:block></th:block>

  <th:block th:fragment="openBadge"><span class="badge badge--warning badge--dot" th:text="${openLabel}">처리중 1</span></th:block>

  <th:block th:fragment="retryButton">
    <button type="button" class="btn btn--sm" ui:attrs="${incidentRetryAttrs}"><th:block th:replace="~{admin/fragments/icons :: refresh(14)}"></th:block>다시 시도</button>
  </th:block>

  <th:block th:fragment="incidentBody">
    <tr th:each="i : ${incidentList}">
      <td><th:block th:replace="~{admin/fragments/ui/badge :: badge(${i.statusLabel}, ${i.open ? 'warn' : 'ok'}, null, null, null)}"></th:block></td>
      <td><strong style="font-size: 13px" th:text="${i.tenant}">Acme</strong></td>
      <td><span class="tag" th:text="${i.type}">AUDIT_CHAIN_TAMPERED</span></td>
      <td><span class="muted" th:text="${i.created}">2026-10-11 12:00</span></td>
      <td><span class="muted" th:text="${i.createdBy}">op@example.com</span></td>
      <td>
        <button type="button" class="btn btn--sm" th:if="${i.open}" th:attr="data-iid=${i.id}, data-label=${i.label}"
                x-on:click="$dispatch('resolve-open', { id: $el.dataset.iid, label: $el.dataset.label }); $dispatch('dialog:open', { id: 'chain-resolve' })"><th:block th:replace="~{admin/fragments/icons :: check(14)}"></th:block>해결</button>
      </td>
    </tr>
  </th:block>

  <th:block th:fragment="icBody">
    <span hidden x-effect="busy = reqBusy"></span>
    <div th:id="${'chain-ic-issue-' + t.tenantId}"></div>
    <p style="margin: 0; font-size: 13px; color: var(--ink-2)" th:text="${t.name + ' 의 위변조 의심을 보안 incident 로 등록하고 대응 이력을 남깁니다.'}">Globex 의 위변조 의심을 보안 incident 로 등록하고 대응 이력을 남깁니다.</p>
    <p class="hint" style="margin: 0">생성 시점에 서버가 재검증해 위변조 entry 를 기록합니다. 이미 진행 중인 incident 가 있거나 재검증 결과 위변조가 아니면 생성되지 않습니다.</p>
  </th:block>

  <th:block th:fragment="icFooter">
    <button type="button" class="btn" x-bind:disabled="reqBusy" x-on:click="close()">취소</button>
    <button type="button" class="btn btn--danger-solid" x-bind:disabled="reqBusy" x-on:click="$dispatch('ic-submit')"><span x-show="!reqBusy">Incident 생성</span><span x-show="reqBusy" x-cloak>생성 중…</span></button>
  </th:block>

  <th:block th:fragment="rsBody">
    <span hidden x-effect="busy = reqBusy"></span>
    <div id="chain-rs-issue"></div>
    <p class="hint" style="margin: 0" x-text="rsLabel"></p>
    <input type="hidden" name="id" x-bind:value="rsId">
    <label class="label" for="rs-note">해결 메모<span class="field__req"> *</span></label>
    <textarea id="rs-note" class="input" rows="3" maxlength="1024" name="note" aria-required="true" x-model="note" placeholder="원인 · 조치 내용"></textarea>
    <p class="hint">필수 · 감사 로그에 함께 기록됩니다.</p>
  </th:block>

  <th:block th:fragment="rsFooter">
    <button type="button" class="btn" x-bind:disabled="reqBusy" x-on:click="close()" x-text="gone ? '닫기' : '취소'">취소</button>
    <button type="button" class="btn btn--primary" x-bind:disabled="reqBusy || gone || note.trim().length === 0" x-on:click="$dispatch('rs-submit')"><span x-show="!reqBusy">해결로 표시</span><span x-show="reqBusy" x-cloak>처리 중…</span></button>
  </th:block>
</th:block>
</body>
</html>
