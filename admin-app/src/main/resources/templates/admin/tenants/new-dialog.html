<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  신규 Tenant 생성 다이얼로그(← TenantsListPage.tsx 의 NewTenantDialog).
    dialog      Task 3 dialog 조각(id=new-tenant). 열기: window 이벤트 dialog:open {id:'new-tenant'}, 또는 모델 ntOpts={open:true}(?new=1)
    formFields  폼 안쪽. 검증 오류·서버 거절은 422 로 이 조각을 돌려주고 htmx 가 #nt-form 안쪽만 교체한다(다이얼로그는 열린 채, 입력값은 nt 로 되돌려 쓴다)
  모델: nt = NewTenantForm(name, slug, rpId, nameError, slugError, rpIdError, failure)
  다이얼로그 안쪽은 x-if 로 그려지므로 열릴 때 dialog 컴포넌트가 htmx.process 한다(ui.js processHtmx). 닫았다 열면 폼이 새로 그려져 비워진다.
  요청 중에는 busy(dialog 컴포넌트)가 켜져 취소·생성 버튼이 비활성, 입력은 readonly, 닫기(Esc·스크림)도 막힌다.
  성공(HX-Redirect)은 htmx 2.0.4 가 successful 을 정하기 전에 이동을 시작하므로(afterRequest 의 successful 이 비어 있음) 응답 헤더로 성공을 알아보고 busy 를 유지한다(이동 중 다시 제출 방지).
-->
<th:block th:fragment="dialog">
  <th:block th:replace="~{admin/fragments/ui/dialog :: dialog('new-tenant', '신규 Tenant 생성', 'RP 회사 하나에 대한 격리된 Passkey 환경을 만듭니다.', ~{:: ntBody}, ~{:: ntFooter}, null, null, ${ntOpts})}"></th:block>
</th:block>

<th:block th:fragment="formFields">
  <!-- 네트워크 오류·시간 초과(응답 없음): 전역 토스트 대신 같은 경고를 인라인으로(form 의 netErr, 서버 거절 경고와 같은 제목) -->
  <div class="banner banner--danger banner--top" x-bind:role="netErr ? 'alert' : null" x-show="netErr" x-cloak>
    <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: alert(18)}"></th:block></span>
    <div class="banner__body">
      <div class="banner__title">Tenant를 만들지 못했습니다</div>
      <div x-text="netErr"></div>
    </div>
  </div>
  <th:block th:if="${nt.failure != null}">
    <th:block th:replace="~{admin/fragments/ui/alert :: alert('bad', 'Tenant를 만들지 못했습니다', ~{:: failureBody}, null, null)}"></th:block>
  </th:block>

  <div>
    <label class="label" for="nt-name">표시 이름</label>
    <input id="nt-name" name="name" class="input" placeholder="예: Acme Corp" autocomplete="off"
           th:value="${nt.name}" x-bind:readonly="busy"
           th:attr="aria-invalid=${nt.nameError != null} ? 'true' : null, aria-describedby=${nt.nameError != null} ? 'nt-name-error' : null">
    <p class="field__error" id="nt-name-error" th:if="${nt.nameError != null}" th:text="${nt.nameError}">오류</p>
  </div>

  <div>
    <label class="label" for="nt-slug">Slug (영문 식별자)</label>
    <input id="nt-slug" name="slug" class="input mono" placeholder="acme-corp" autocomplete="off"
           th:value="${nt.slug}" x-bind:readonly="busy" x-on:input="$el.value = $el.value.toLowerCase()"
           th:attr="aria-invalid=${nt.slugError != null} ? 'true' : null, aria-describedby=${nt.slugError != null} ? 'nt-slug-error' : null">
    <p class="field__error" id="nt-slug-error" th:if="${nt.slugError != null}" th:text="${nt.slugError}">오류</p>
    <p class="hint" th:if="${nt.slugError == null}">소문자·숫자·하이픈. URL 과 로그에서 tenant 를 식별합니다.</p>
  </div>

  <div>
    <label class="label" for="nt-rpid">RP ID</label>
    <input id="nt-rpid" name="rpId" class="input mono" placeholder="예: passkey.acme.com" autocomplete="off"
           th:value="${nt.rpId}" x-bind:readonly="busy" x-on:input="$el.value = $el.value.toLowerCase().trim()"
           th:attr="aria-invalid=${nt.rpIdError != null} ? 'true' : null, aria-describedby=${nt.rpIdError != null} ? 'nt-rpid-error' : null">
    <p class="field__error" id="nt-rpid-error" th:if="${nt.rpIdError != null}" th:text="${nt.rpIdError}">오류</p>
    <p class="hint" th:if="${nt.rpIdError == null}">
      <span class="row" style="gap: 5px; color: var(--warn); flex-wrap: nowrap">
        <th:block th:replace="~{admin/fragments/icons :: lock(13)}"></th:block>
        <span>생성 후에는 변경할 수 없습니다. 기존 credential 이 이 값에 묶입니다.</span>
      </span>
    </p>
  </div>

  <div class="stack-2" style="gap: 10px; padding: 14px 16px; border-radius: var(--r); background: var(--brand-50); border: 1px solid var(--brand-100)">
    <span class="t-over" id="nt-next-steps" style="color: var(--brand-700)">다음 단계</span>
    <ol aria-labelledby="nt-next-steps" class="stack-2" style="list-style: none; margin: 0; padding: 0; gap: 10px">
      <li class="row" style="gap: 10px; flex-wrap: nowrap; font-size: 13px"><span aria-hidden="true" class="nt-step">1</span><strong>WebAuthn config</strong><span class="muted">origin · UV · attestation</span></li>
      <li class="row" style="gap: 10px; flex-wrap: nowrap; font-size: 13px"><span aria-hidden="true" class="nt-step">2</span><strong>AAGUID 정책</strong><span class="muted">허용할 인증기</span></li>
      <li class="row" style="gap: 10px; flex-wrap: nowrap; font-size: 13px"><span aria-hidden="true" class="nt-step">3</span><strong>API key 발급</strong><span class="muted">RP 서버 연동</span></li>
    </ol>
  </div>
</th:block>

<!-- dialog 조각 인자 원본: 화면에는 dialog 안쪽에서만 그려진다. -->
<th:block th:remove="all">
  <form th:fragment="ntBody" id="nt-form" class="dialog__form" novalidate data-quiet
        hx-post="/admin/_/tenants" hx-target="this" hx-swap="innerHTML" hx-sync="this:drop"
        x-data="{ netErr: null }"
        x-on:htmx:before-request="busy = true; netErr = null"
        x-on:htmx:after-request="if (!$event.detail.successful &amp;&amp; !($event.detail.xhr &amp;&amp; $event.detail.xhr.getResponseHeader('HX-Redirect'))) busy = false"
        x-on:htmx:send-error="netErr = '네트워크에 연결할 수 없습니다. 연결 상태를 확인한 뒤 다시 시도하세요. 입력한 내용은 그대로 있습니다.'"
        x-on:htmx:timeout="netErr = '서버가 잠시 응답하지 않습니다. 응답이 오지 않아 요청을 중단했습니다. 잠시 후 다시 시도하세요. 입력한 내용은 그대로 있습니다.'"
        x-on:htmx:after-swap="$nextTick(() => { const f = $el.querySelector('[aria-invalid=true]'); if (f) f.focus() })">
    <th:block th:replace="~{:: formFields}"></th:block>
  </form>

  <th:block th:fragment="ntFooter">
    <button type="button" class="btn" x-on:click="close()" x-bind:disabled="busy">취소</button>
    <button type="submit" form="nt-form" id="nt-submit" class="btn btn--primary" x-bind:disabled="busy"><span x-show="!busy">생성하고 설정으로 이동</span><span x-show="busy" x-cloak>생성 중…</span></button>
  </th:block>

  <th:block th:fragment="failureBody"><th:block th:text="${nt.failure.text}">오류. 입력한 내용은 그대로 있습니다.</th:block><span class="mono" style="display: block; margin-top: 4px; font-size: 12px" th:if="${nt.failure.meta != ''}" th:text="${nt.failure.meta}">HTTP 503</span></th:block>
</th:block>
</body>
</html>
