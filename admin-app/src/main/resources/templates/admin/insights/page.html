<!DOCTYPE html>
<html th:replace="~{admin/layout :: page(title=~{::title}, crumbs=~{::crumbs}, content=~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>현황</title></head>
<body>
<!--
  플랫폼 현황(PLATFORM 전용). 화면 템플릿 규약: layout 한 줄 + title / crumbs / main.
  기간·정렬 전환과 다시 시도는 #insights-root 만 교체한다(GET /admin/_/insights). 대상(hx-target·swap·sync)은 요청 요소마다 직접 준다 —
  루트에 두면 안의 테넌트 링크(boost)가 물려받아 이동한 페이지가 루트 안에 그려진다. 루트 상태는 Alpine funnelTab(app.js) —
  요청 중 pending(스켈레톤·CSV 막음), 교체 없이 실패하면 세그먼트를 보이는 기간(data-win)으로 되돌린다.
  모델: win, sort, segOptions, retryAttrs, loadError, hasData, period, kpis(AdoptKpi 6장), alerts(AlertView), thresholdText,
        tenants(TenantView), sortHeaders, seriesCard/seriesColumns, months/monthColumns, devices, csvTenants/csvMonthly/csvDevices
  사용자 값(테넌트 이름·slug)은 th:text/th:href 로만 쓴다.
-->
<th:block th:fragment="crumbs"><th:block th:replace="~{admin/fragments/shell/breadcrumb :: breadcrumb(${breadcrumbs})}"></th:block></th:block>
<main>
<div class="page">
  <th:block th:replace="~{admin/fragments/ui/pageHeader :: pageHeader('현황', '전체 테넌트의 패스키 사용량 · 인증 품질 · 확인이 필요한 곳을 한눈에 봅니다.', null)}"></th:block>
  <th:block th:replace="~{:: root}"></th:block>
</div>
</main>

<div th:fragment="root" id="insights-root" class="stack-6" th:attr="data-win=${win}"
     x-data="funnelTab" x-on:htmx:before-request="begin()" x-on:htmx:after-request="end($event)">
  <div class="row" style="gap: 16px">
    <th:block th:replace="~{admin/fragments/ui/segmented :: segmented(null, ${segOptions}, ${win}, '기간')}"></th:block>
    <div class="spacer"></div>
    <a th:if="${hasData}" class="btn" th:href="${csvTenants}" hx-boost="false" download data-csv-download
       x-bind:aria-disabled="pending" x-on:click="if (pending) $event.preventDefault()">
      <th:block th:replace="~{admin/fragments/icons :: download(14)}"></th:block>테넌트별 내보내기</a>
  </div>

  <div x-show="pending" x-cloak><th:block th:replace="~{admin/fragments/ui/skeleton :: skeleton(6, '현황 불러오는 중')}"></th:block></div>
  <div class="stack-6" x-show="!pending">
  <th:block th:if="${loadError != null}">
    <th:block th:replace="~{admin/fragments/ui/loadError :: loadError('플랫폼 현황', ${loadError}, ${retryAttrs}, false, false)}"></th:block>
  </th:block>

  <th:block th:if="${loadError == null}">
    <div class="kpis kpis--3">
      <div class="kpi" th:each="k : ${kpis}">
        <span class="kpi__label" th:text="${k.label}">활성 사용자</span>
        <span class="kpi__value" th:text="${k.value}">120명</span>
        <span class="kpi__hint" th:classappend="${k.warn} ? 'kpi__hint--warn'" th:text="${k.hint}">최근 7일</span>
      </div>
    </div>

    <section class="card" data-alerts>
      <th:block th:replace="~{admin/fragments/ui/card :: cardHeader('확인이 필요한 테넌트', ${thresholdText}, null, null)}"></th:block>
      <div class="card__body">
        <p th:if="${#lists.isEmpty(alerts)}" class="hint" style="margin: 0">확인이 필요한 테넌트가 없어요.</p>
        <ul th:unless="${#lists.isEmpty(alerts)}" class="ins-alerts">
          <li th:each="a : ${alerts}">
            <span class="badge" th:classappend="${a.badgeClass}" th:text="${a.kindLabel}">위험 인증</span>
            <a th:href="${a.href}" th:text="${a.name}">Demo RP</a>
            <span class="hint" style="margin: 0" th:text="${a.message}">최근 7일 차단된 위험 인증 3건</span>
          </li>
        </ul>
      </div>
    </section>

    <section class="card" data-tenants>
      <th:block th:replace="~{admin/fragments/ui/card :: cardHeader('테넌트별 비교', ${period + ' 기준. 머리글을 누르면 그 값이 큰 순으로 정렬해요.'}, null, null)}"></th:block>
      <div class="card__body">
        <p th:if="${#lists.isEmpty(tenants)}" class="hint" style="margin: 0">테넌트가 없습니다.</p>
        <div th:unless="${#lists.isEmpty(tenants)}" class="tw">
          <table class="table">
            <thead>
              <tr>
                <th>테넌트</th>
                <th>상태</th>
                <th th:each="h : ${sortHeaders}" class="num" th:attr="aria-sort=${h.active} ? 'descending' : 'none'">
                  <button type="button" class="ins-sort" th:classappend="${h.active} ? 'ins-sort--on'" ui:attrs="${h.attrs}" th:text="${h.label}">활성 사용자</button>
                </th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${tenants}">
                <td><a th:href="${r.href}" th:text="${r.name}">Demo RP</a> <span class="mono hint" style="margin: 0" th:text="${r.slug}">demo-rp</span></td>
                <td><span class="badge" th:classappend="${r.statusClass}" th:text="${r.statusLabel}">활성</span></td>
                <td class="num" th:text="${r.usersText}">18</td>
                <td class="num" th:text="${r.authText}">106</td>
                <td class="num" th:text="${r.authRateText}">89.1%</td>
                <td class="num" th:text="${r.regRateText}">75.7%</td>
                <td class="num" th:classappend="${r.riskWarn} ? 'ins-warn'" th:text="${r.riskText}">3</td>
                <td class="num" th:text="${r.credsText}">25</td>
                <td class="num" th:text="${r.singleText}">61.1%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <div class="grid-2">
      <th:block th:replace="~{admin/fragments/ui/stats :: seriesCard(${seriesCard}, ${seriesColumns})}"></th:block>
      <th:block th:replace="~{admin/fragments/ui/stats :: monthCard(${months}, ${monthColumns}, ${csvMonthly}, '인증 기록은 90일 보관돼요. 활성 사용자는 테넌트별 사용자 수의 합이에요.')}"></th:block>
    </div>

    <th:block th:replace="~{admin/fragments/ui/stats :: devicesCard(${devices}, ${csvDevices}, '전체 테넌트에 등록된 패스키를 만든 인증기별 비율이에요.')}"></th:block>
  </th:block>
  </div>
</div>
</body>
</html>
