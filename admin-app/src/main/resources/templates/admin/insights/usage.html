<!DOCTYPE html>
<html th:replace="~{admin/layout :: page(title=~{::title}, crumbs=~{::crumbs}, content=~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>사용량 정산</title></head>
<body>
<!--
  사용량 정산(PLATFORM 전용). 청구 근거는 마감된 달의 숫자이고 감사 로그에 남긴 같은 숫자와 대조한 결과를 함께 보인다.
  화면 템플릿 규약: layout 한 줄 + title / crumbs / main. 기간 선택은 일반 GET 폼(JS 없음).
  모델: tabItems/tabActive, period, statusLabel/statusClass, pendingClose(마감 대기 안내 표시), basisLabel, verificationLabel(null=표시 안 함)/verificationClass,
        asOfLabel/asOfText, periodOptions(value, selected), tenants(TenantView), totalReg/totalAuth/totalAll,
        trend(TrendView), csvTenants/csvTrend
  사용자 값(테넌트 이름·slug)은 th:text 로만 쓴다.
-->
<th:block th:fragment="crumbs"><th:block th:replace="~{admin/fragments/shell/breadcrumb :: breadcrumb(${breadcrumbs})}"></th:block></th:block>
<main>
<div class="page">
  <th:block th:replace="~{admin/fragments/ui/pageHeader :: pageHeader('사용량 정산', '등록·인증 성공 건수 — 청구의 근거가 되는 월별 숫자예요.', null)}"></th:block>
  <th:block th:replace="~{admin/fragments/ui/tabs :: tabs(${tabItems}, ${tabActive}, '현황 보기')}"></th:block>

  <div class="stack-6">
    <form method="get" th:action="@{/admin/insights/usage}" class="row" style="gap: 8px" hx-boost="false">
      <label for="usage-period" class="hint" style="margin: 0">기간</label>
      <select id="usage-period" name="period" class="input" style="width: 160px">
        <option th:each="o : ${periodOptions}" th:value="${o.value}" th:selected="${o.selected}" th:text="${o.value}">2026-11</option>
      </select>
      <button type="submit" class="btn">보기</button>
      <div class="spacer"></div>
      <a class="btn" th:href="${csvTenants}" hx-boost="false" download data-csv-download>테넌트별 내보내기</a>
    </form>

    <section class="card" data-usage-tenants>
      <th:block th:replace="~{admin/fragments/ui/card :: cardHeader('테넌트별 성공 건수', null, null, null)}"></th:block>
      <div class="card__body stack-3">
        <div class="row" style="gap: 12px; flex-wrap: wrap" data-usage-status>
          <strong data-usage-period th:text="${period}">2026-10</strong>
          <span class="badge" th:classappend="${statusClass}" th:text="${statusLabel}">마감</span>
          <span th:if="${pendingClose}" class="hint" style="margin: 0" data-usage-pending-note>아직 마감되지 않은 숫자예요. 청구에 쓰지 마세요.</span>
          <span class="hint" style="margin: 0">집계 기준 <span th:text="${basisLabel}">장부</span></span>
          <span th:if="${verificationLabel != null}" class="badge" th:classappend="${verificationClass}" th:text="${verificationLabel}">감사 로그와 일치</span>
          <span th:if="${asOfText != null}" class="hint" style="margin: 0"><th:block th:text="${asOfLabel}">마감</th:block> <span th:text="${asOfText}">2026-11-01 02:00</span></span>
        </div>
        <div class="tw">
          <table class="table">
            <thead>
              <tr><th>테넌트</th><th class="num">등록 성공</th><th class="num">인증 성공</th><th class="num">합계</th></tr>
            </thead>
            <tbody>
              <tr th:each="r : ${tenants}">
                <td><span th:text="${r.name}">Demo RP</span> <span th:if="${r.slug != null}" class="mono hint" style="margin: 0" th:text="${r.slug}">demo-rp</span></td>
                <td class="num" th:text="${r.regText}">10</td>
                <td class="num" th:text="${r.authText}">20</td>
                <td class="num" th:text="${r.totalText}">30</td>
              </tr>
              <tr th:if="${#lists.isEmpty(tenants)}"><td colspan="4" class="hint">테넌트가 없습니다.</td></tr>
            </tbody>
            <tfoot>
              <tr><td>전체</td><td class="num" th:text="${totalReg}">10</td><td class="num" th:text="${totalAuth}">20</td><td class="num" th:text="${totalAll}">30</td></tr>
            </tfoot>
          </table>
        </div>
      </div>
    </section>

    <section class="card" data-usage-trend>
      <th:block th:replace="~{admin/fragments/ui/card :: cardHeader('월별 추이', '최근 12개월. 인증 성공률은 참고용이고 청구와 무관해요.', null, null)}"></th:block>
      <div class="card__body stack-3">
        <div class="tw">
          <table class="table">
            <thead>
              <tr><th>월</th><th class="num">등록 성공</th><th class="num">인증 성공</th><th class="num">사용 테넌트</th><th class="num">인증 성공률(참고)</th></tr>
            </thead>
            <tbody>
              <tr th:each="m : ${trend}">
                <td th:text="${m.period}">2026-10</td>
                <td class="num" th:text="${m.regText}">10</td>
                <td class="num" th:text="${m.authText}">20</td>
                <td class="num" th:text="${m.tenantsText}">2</td>
                <td class="num" th:text="${m.rateText}">92.0%</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="row" style="gap: 8px">
          <a class="btn btn--ghost btn--sm" th:href="${csvTrend}" hx-boost="false" download data-csv-download>추이 내보내기</a>
        </div>
      </div>
    </section>
  </div>
</div>
</main>
</body>
</html>
