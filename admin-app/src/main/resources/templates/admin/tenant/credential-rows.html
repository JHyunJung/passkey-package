<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  자격 증명 목록의 부분 갱신 조각(← CredentialsTab.tsx 의 표·필터·페이지네이션). 탭(credentials.html)과 GET …/tab/credentials/list 가 같은 조각을 그린다.
    response        목록 응답 한 벌: #cred-results + OOB(필터 컨트롤, reset 일 때 검색 입력·필터 패널)
    results         #cred-results — 숨은 상태값(status·size), 표 또는 LoadError, 페이지네이션
    controls(oob)   #cred-controls — 필터 버튼, 적용된 칩, 건수, CSV
    panel(oob)      #cred-filterpanel — aaguid 입력 + 상태 세그먼트(원본 filtersOpen)
    searchInput(oob) 검색 입력(타이핑 중에는 OOB 로 되돌려 쓰지 않는다)
  모델: tid, q, aaguidFilter, status, size, page, pageSizes, columns, total, rows, loadError/retryAttrs, clientFiltered, noData, countText,
        csvLabel/csvDisabled/csvUrl, statusLabel, statusOptions, chipAaguidAttrs/chipStatusAttrs/clearAttrs, pageBase, pageUrlBase, include*, listOob, oobQ, oobPanel
  사용자 입력(q·aaguid)은 th:value/th:text 로만 쓰고 hx-* 주소에는 인코딩해서만 들어간다.
-->

<th:block th:fragment="response">
  <th:block th:replace="~{:: results}"></th:block>
  <th:block th:replace="~{:: controls(true)}"></th:block>
  <th:block th:if="${oobPanel}"><th:block th:replace="~{:: panel(true)}"></th:block></th:block>
  <th:block th:if="${oobQ}"><th:block th:replace="~{:: searchInput(true)}"></th:block></th:block>
</th:block>

<input th:fragment="searchInput(oob)" id="cred-q" name="q" type="search" class="input" aria-label="Credential 검색"
       placeholder="Credential ID · 사용자 ID 검색" autocomplete="off"
       title="Credential ID 또는 사용자 ID 의 일부로 찾습니다. 별칭·인증기 이름은 검색되지 않습니다."
       th:value="${q}" th:attr="hx-swap-oob=${oob} ? 'true' : null, hx-get=${pageBase}, hx-include=${includeForQ}"
       hx-trigger="input changed delay:300ms, search" hx-target="#cred-results" hx-swap="outerHTML">

<div th:fragment="controls(oob)" id="cred-controls" style="display: contents" th:attr="hx-swap-oob=${oob} ? 'true' : null">
  <button type="button" class="fchip" aria-pressed="false" x-on:click="filtersOpen = !filtersOpen"
          x-bind:class="{ 'fchip--on': filtersOpen }" x-bind:aria-pressed="filtersOpen">
    <th:block th:replace="~{admin/fragments/icons :: plus(13)}"></th:block>필터 · aaguid · 상태</button>
  <th:block th:if="${aaguidFilter != ''}"><th:block
            th:replace="~{admin/fragments/ui/chips :: removableChip(${'aaguid: ' + aaguidFilter}, 'aaguid 필터 제거', null, true, false, ${chipAaguidAttrs})}"></th:block></th:block>
  <th:block th:if="${status != 'ALL'}">
    <span class="chip" th:title="${status}">
      <span class="truncate" th:text="${'상태: ' + statusLabel}">상태: 활성</span>
      <button type="button" class="chip__x" aria-label="상태 필터 제거" ui:attrs="${chipStatusAttrs}"><th:block th:replace="~{admin/fragments/icons :: x(12)}"></th:block></button>
    </span>
  </th:block>
  <div class="spacer"></div>
  <span class="hint" style="margin: 0" th:text="${countText}">0건</span>
  <a th:unless="${csvDisabled}" class="btn" th:href="${csvUrl}" hx-boost="false" download>
    <th:block th:replace="~{admin/fragments/icons :: download(14)}"></th:block><th:block th:text="${csvLabel}">CSV 내보내기 (현재 페이지 0건)</th:block></a>
  <button th:if="${csvDisabled}" type="button" class="btn" disabled>
    <th:block th:replace="~{admin/fragments/icons :: download(14)}"></th:block><th:block th:text="${csvLabel}">CSV 내보내기 (현재 페이지 0건)</th:block></button>
</div>

<div th:fragment="panel(oob)" id="cred-filterpanel" class="row cred-filters" x-show="filtersOpen" x-cloak th:attr="hx-swap-oob=${oob} ? 'true' : null">
  <label class="row" style="gap: 6px; font-size: 12px; color: var(--mute); flex-wrap: nowrap">aaguid
    <input id="cred-aaguid" name="aaguid" class="input mono" style="width: 280px; min-height: 30px" placeholder="예: ea9b8d66" autocomplete="off"
           th:value="${aaguidFilter}" th:attr="hx-get=${pageBase}, hx-include=${includeForAaguid}"
           hx-trigger="input changed delay:300ms" hx-target="#cred-results" hx-swap="outerHTML">
  </label>
  <th:block th:replace="~{admin/fragments/ui/segmented :: segmented(null, ${statusOptions}, ${status}, '상태 필터')}"></th:block>
  <span class="hint" style="margin: 0">현재 페이지 안에서 거릅니다.</span>
</div>

<div th:fragment="results" id="cred-results" th:with="pg=${@fmt.pager(page, size, total)}"
     th:attr="hx-swap-oob=${listOob} ? 'true' : null">
  <!-- 다음 요청(검색 입력·필터·페이지 크기)이 이어 받는 현재 상태 -->
  <input type="hidden" id="cred-status" name="status" th:value="${status}">
  <input type="hidden" id="cred-size" name="size" th:value="${size}">

  <th:block th:if="${loadError != null}">
    <th:block th:replace="~{admin/fragments/ui/loadError :: loadError('Credential 목록', ${loadError}, ${retryAttrs}, false, false)}"></th:block>
  </th:block>
  <th:block th:if="${loadError == null}">
    <th:block th:replace="~{admin/fragments/ui/dataTable :: dataTable(${columns}, ~{:: tableBody})}"></th:block>
    <div class="pager">
      <span th:text="${total == 0} ? '0건' : ${pg.from + '–' + pg.to + ' / ' + total + '건'}">1–50 / 120건</span>
      <div class="spacer"></div>
      <label class="row pager__size">페이지당
        <select class="input" name="size" th:attr="hx-get=${pageBase}, hx-include=${includeForSize}" hx-trigger="change"
                hx-target="#cred-results" hx-swap="outerHTML">
          <option th:each="n : ${pageSizes}" th:value="${n}" th:selected="${n == size}" th:text="${n}">50</option>
        </select>
      </label>
      <button th:if="${pg.page > 1}" type="button" class="btn btn--sm" aria-label="이전 페이지"
              th:attr="hx-get=${pageUrlBase + (pg.page - 1)}, hx-include=${includeAll}" hx-target="#cred-results" hx-swap="outerHTML"><th:block th:replace="~{admin/fragments/icons :: chevronLeft(14)}"></th:block></button>
      <button th:unless="${pg.page > 1}" type="button" class="btn btn--sm" aria-label="이전 페이지" disabled><th:block th:replace="~{admin/fragments/icons :: chevronLeft(14)}"></th:block></button>
      <span th:text="${pg.page + ' / ' + pg.last}">1 / 3</span>
      <button th:if="${pg.page < pg.last}" type="button" class="btn btn--sm" aria-label="다음 페이지"
              th:attr="hx-get=${pageUrlBase + (pg.page + 1)}, hx-include=${includeAll}" hx-target="#cred-results" hx-swap="outerHTML"><th:block th:replace="~{admin/fragments/icons :: chevronRight(14)}"></th:block></button>
      <button th:unless="${pg.page < pg.last}" type="button" class="btn btn--sm" aria-label="다음 페이지" disabled><th:block th:replace="~{admin/fragments/icons :: chevronRight(14)}"></th:block></button>
    </div>
  </th:block>
</div>

<!-- dataTable 의 body 조각: 행 클릭 = cred-open 이벤트 → 상세. 셀 안 버튼·링크의 클릭은 행으로 치지 않는다. -->
<th:block th:fragment="tableBody">
  <tr th:each="r : ${rows}" class="is-clickable" tabindex="0" x-data ui:attrs="${r.detailAttrs}"
      x-on:click="if (!$event.target.closest('a, button')) $dispatch('cred-open')"
      x-on:keydown.self.enter.prevent="$dispatch('cred-open')" x-on:keydown.self.space.prevent="$dispatch('cred-open')">
    <td>
      <span class="row" style="gap: 4px; flex-wrap: nowrap">
        <span class="mono truncate" style="font-size: 12px; max-width: 120px" th:title="${r.id}" th:text="${r.id}">AbCd…</span>
        <th:block th:replace="~{admin/fragments/ui/copyBtn :: copyBtn(${r.id}, 'Credential ID 복사', true)}"></th:block>
      </span>
    </td>
    <td><span class="mono truncate" style="font-size: 12px; display: inline-block; max-width: 200px; vertical-align: middle" th:title="${r.userHandle}" th:text="${r.userHandle}">user</span></td>
    <td>
      <span th:if="${r.nickname != null and r.nickname != ''}" style="font-size: 13px; color: var(--ink-2)" th:text="${r.nickname}">별칭</span>
      <span th:unless="${r.nickname != null and r.nickname != ''}" class="muted">—</span>
    </td>
    <td>
      <span class="row" style="gap: 6px; flex-wrap: nowrap" th:title="${r.aaguid}">
        <span aria-hidden="true" class="cred-authn-ico"><th:block th:replace="~{admin/fragments/icons :: fingerprint(13)}"></th:block></span>
        <span th:if="${r.authenticatorNamed}" style="font-size: 13px" th:text="${r.authenticator}">YubiKey</span>
        <span th:unless="${r.authenticatorNamed}" class="mono" style="font-size: 12px; color: var(--mute)" th:text="${r.authenticator}">12345678</span>
      </span>
    </td>
    <td><span class="row" style="gap: 4px"><span th:each="t : ${r.transports}" class="tag" th:title="${t.value}" th:text="${t.label}">USB</span></span></td>
    <td class="num">
      <span th:if="${r.counterKind == 'value'}" class="mono" style="font-size: 12px" th:text="${r.signCount}">3</span>
      <!-- 인증됐는데 counter=0 → counterless 인증기(플랫폼·싱크 패스키). WebAuthn 정상, counter 기반 복제 탐지 미적용. -->
      <span th:if="${r.counterKind == 'na'}" class="mono" style="font-size: 12px; color: var(--mute)"
            title="counterless 인증기 — 플랫폼·싱크 패스키는 signCount가 0으로 고정됩니다(WebAuthn 정상). counter 기반 복제 탐지 미적용.">N/A</span>
      <span th:if="${r.counterKind == 'zero'}" class="mono" style="font-size: 12px; color: var(--mute)">0</span>
    </td>
    <td><th:block th:replace="~{admin/fragments/ui/statusBadge :: statusBadge('ACTIVE')}"></th:block></td>
    <td><span style="font-size: 13px; color: var(--ink-2)" th:text="${r.lastUsed}">3분 전</span></td>
    <td><th:block th:replace="~{admin/fragments/ui/iconButton :: iconButton(${r.revokeLabel}, ~{admin/fragments/icons :: trash(15)}, null, 'danger', ${r.revokeAttrs})}"></th:block></td>
  </tr>
  <th:block th:if="${#lists.isEmpty(rows) and noData}"><th:block
            th:replace="~{admin/fragments/ui/dataTable :: tableEmptyRow(9, ~{:: emptyNone})}"></th:block></th:block>
  <th:block th:if="${#lists.isEmpty(rows) and !noData}"><th:block
            th:replace="~{admin/fragments/ui/dataTable :: tableEmptyRow(9, ~{:: noResults})}"></th:block></th:block>
</th:block>

<th:block th:fragment="emptyNone">
  <th:block th:replace="~{admin/fragments/ui/emptyState :: emptyState('/admin/img/empty-credentials.webp', 'Credential이 없습니다', '사용자가 RP 에서 패스키를 등록하면 여기에 나타납니다.', null, false)}"></th:block>
</th:block>

<th:block th:fragment="noResults">
  <th:block th:replace="~{admin/fragments/ui/emptyState :: emptyState('/admin/img/no-results.webp', '검색 결과가 없습니다.', '검색어나 필터를 바꿔 보세요.', ~{:: clearButton}, false)}"></th:block>
</th:block>

<button th:fragment="clearButton" type="button" class="btn btn--sm" ui:attrs="${clearAttrs}">필터 지우기</button>
</body>
</html>
