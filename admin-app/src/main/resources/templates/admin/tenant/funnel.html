<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  인증 현황 탭(URL 키는 funnel). 탭 조각 GET /admin/_/tenants/{id}/tab/funnel?win=1|7|30.
  모델: tid, win, segOptions, retryAttrs, loadError, hasData, rateKpis(RateKpi 2장: 등록·인증), failTotal/failHint/failAlert, period/periodHint,
        seriesCards(SeriesCard 2장)/seriesColumns, failures/failureColumns, csvSummary/csvFailures,
        adoptError, adoptKpis(AdoptKpi 4장), months/monthColumns, devices, csvMonthly/csvDevices
  기간 전환·다시 시도는 #funnel-root 만 교체한다(hx-target=this). 루트 상태는 Alpine funnelTab(app.js). 막대 너비·높이는 서버가 계산한 숫자만 th:style 에 들어가고 색은 CSS 클래스다.
  실패 원인 코드·이름·날짜는 th:text/th:title 로만 쓴다. 표로 보기는 서버가 둘 다 그려 두고 Alpine 이 보이는 쪽만 바꾼다.
-->
<div th:fragment="tab" id="funnel-root" class="stack-6" hx-target="this" hx-swap="outerHTML" hx-sync="this:replace" th:attr="data-win=${win}"
     x-data="funnelTab" x-on:htmx:before-request="begin()" x-on:htmx:after-request="end($event)">
  <div class="row" style="gap: 16px">
    <th:block th:replace="~{admin/fragments/ui/segmented :: segmented(null, ${segOptions}, ${win}, '기간')}"></th:block>
    <div class="spacer"></div>
    <a th:if="${hasData}" class="btn" th:href="${csvSummary}" hx-boost="false" download data-csv-download
       x-bind:aria-disabled="pending" x-on:click="if (pending) $event.preventDefault()">
      <th:block th:replace="~{admin/fragments/icons :: download(14)}"></th:block>내보내기</a>
    <button th:unless="${hasData}" type="button" class="btn" disabled>
      <th:block th:replace="~{admin/fragments/icons :: download(14)}"></th:block>내보내기</button>
  </div>

  <!-- 기간 전환 중에는 이전 결과를 숨기고 스켈레톤(원본: 전환 중 data 를 쓰지 않음). 요청이 교체 없이 실패하면(네트워크·서버 오류 토스트)
       after-request 가 결과를 다시 보이고 세그먼트 선택도 보이는 기간(data-win)으로 되돌린다(funnelTab) — CSV 링크·숫자와 선택이 어긋나지 않는다. -->
  <div x-show="pending" x-cloak><th:block th:replace="~{admin/fragments/ui/skeleton :: skeleton(6, '인증 현황 불러오는 중')}"></th:block></div>
  <div class="stack-6" x-show="!pending">
  <th:block th:if="${loadError != null}">
    <th:block th:replace="~{admin/fragments/ui/loadError :: loadError('인증 현황', ${loadError}, ${retryAttrs}, false, false)}"></th:block>
  </th:block>

  <th:block th:if="${loadError == null}">
    <h2 class="fn-section">인증 품질</h2>
    <div class="kpis">
      <div class="kpi" th:each="k : ${rateKpis}">
        <span class="kpi__label" th:text="${k.label}">인증 성공률</span>
        <span class="kpi__value" th:text="${k.value}">89.1%</span>
        <span class="kpi__hint" th:text="${k.hint}">성공 106 / 시도 119 · 직전 7일 대비 +1.2%p</span>
      </div>
      <div class="kpi">
        <span class="kpi__label">차단된 위험 인증</span>
        <span class="kpi__value" th:text="${failTotal}">3건</span>
        <span class="kpi__hint" th:classappend="${failAlert} ? 'kpi__hint--warn'" th:text="${failHint}">서명 검증 실패 2 · 서명 카운터 재사용 1</span>
      </div>
      <div class="kpi">
        <span class="kpi__label">기간</span>
        <span class="kpi__value"><span style="font-size: 20px" th:text="${period}">최근 7일</span></span>
        <span class="kpi__hint" th:text="${periodHint}">2026-10-05 – 2026-10-11</span>
      </div>
    </div>
    <p class="hint" style="margin: 0">성공하지 못한 시도에는 사용자 취소와 시간 초과도 포함돼요. 성공률이 평소보다 떨어지는지 추이로 확인하세요.</p>

    <div class="grid-2">
      <th:block th:each="c : ${seriesCards}"><th:block th:replace="~{admin/fragments/ui/stats :: seriesCard(${c}, ${seriesColumns})}"></th:block></th:block>
    </div>

    <section class="card" data-failures>
      <th:block th:replace="~{admin/fragments/ui/card :: cardHeader('인증 실패 원인', ${'패스키 인증이 검증 단계에서 거절된 건 — ' + period + '. 사용자 취소·시간 초과는 포함되지 않아요.'}, null, null)}"></th:block>
      <div class="card__body stack-3">
        <p th:if="${#lists.isEmpty(failures)}" class="hint" style="margin: 0">기간 안에 인증 실패가 없습니다.</p>
        <th:block th:unless="${#lists.isEmpty(failures)}"><th:block th:replace="~{admin/fragments/ui/dataTable :: dataTable(${failureColumns}, ~{:: failureBody})}"></th:block></th:block>
        <div class="row" style="gap: 8px" th:unless="${#lists.isEmpty(failures)}">
          <a class="btn btn--ghost btn--sm" th:href="${csvFailures}" hx-boost="false" download data-csv-download x-bind:aria-disabled="pending" x-on:click="if (pending) $event.preventDefault()">CSV</a>
        </div>
      </div>
    </section>

    <h2 class="fn-section">패스키 도입·사용</h2>
    <th:block th:if="${adoptError != null}">
      <th:block th:replace="~{admin/fragments/ui/loadError :: loadError('패스키 도입 지표', ${adoptError}, ${retryAttrs}, false, false)}"></th:block>
    </th:block>
    <th:block th:if="${adoptError == null}">
      <div class="kpis" data-adoption>
        <div class="kpi" th:each="k : ${adoptKpis}">
          <span class="kpi__label" th:text="${k.label}">활성 사용자</span>
          <span class="kpi__value" th:text="${k.value}">120명</span>
          <span class="kpi__hint" th:classappend="${k.warn} ? 'kpi__hint--warn'" th:text="${k.hint}">기간 중 인증 성공</span>
        </div>
      </div>

      <div class="grid-2">
        <th:block th:replace="~{admin/fragments/ui/stats :: monthCard(${months}, ${monthColumns}, ${csvMonthly}, '인증 기록은 90일 보관돼요. 이번 달 포함 최근 3개월만 집계해요.')}"></th:block>

        <th:block th:replace="~{admin/fragments/ui/stats :: devicesCard(${devices}, ${csvDevices}, '등록된 패스키를 만든 인증기별 비율이에요.')}"></th:block>
      </div>
    </th:block>
  </th:block>
  </div>
</div>

<th:block th:fragment="failureBody">
  <tr th:each="f : ${failures}">
    <td><strong th:text="${f.label}" th:title="${f.code}">서명 검증 실패</strong></td>
    <td class="hint" style="margin: 0" th:text="${f.meaning}">등록된 공개키로 서명을 확인하지 못했어요.</td>
    <td class="num" th:text="${f.nText}">2</td>
  </tr>
</th:block>
</body>
</html>
