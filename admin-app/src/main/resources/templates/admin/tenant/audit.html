<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  감사 로그 탭(← pages/tenant/AuditTab.tsx). 탭 조각 GET /admin/_/tenants/{id}/tab/audit.
  모델: tid, platform, tenantName, chainResult(null | ChainResult), verifyUrl, (audit-rows 의 카드 모델 전부)
  #audit-root 안: #audit-chain(PLATFORM 전용 체인 검증 카드·다이얼로그), #audit-card(필터·표·더 보기).
  원본에는 자동 갱신(폴링)이 없다 — hx-trigger every 를 두지 않는다. 기간·다시 시도 요청은 #tenant-tab 이 아니라 #audit-card 만 교체하고,
  더 보기는 표 끝에 행을 붙인다. 필터는 클라이언트(auditFilter)가 거른다.

  chain 조각: 래퍼 #audit-chain 이 요청 요소다(hx-trigger=verify-run). 다이얼로그의 "검증 실행"은 verify-run 이벤트만 올리므로
  다이얼로그를 닫아도(요소가 사라져도) 요청은 래퍼에서 계속된다. 성공하면 래퍼 전체가 결과로 교체되고(다이얼로그도 닫힘),
  실패하면 서버가 오류 상태 + 토스트(본문 없음)를 보내 래퍼가 그대로 남는다. 경과 시간 타이머는 래퍼가 떨어져 나가면 스스로 멈춘다.
  tenantName 은 th:text 로만 쓴다.
-->
<th:block th:fragment="tab">
  <!-- 이벤트 종류·실패만 필터 상태(Alpine auditFilter)는 카드 밖 여기 있다 — 기간 전환·다시 시도로 카드가 바뀌어도 유지되고(원본과 같다),
       카드 교체·더 보기로 행이 들어오면(htmx after-swap/settle) 다시 거른다. -->
  <div id="audit-root" class="stack-6" x-data="auditFilter" x-on:htmx:after-swap="apply()" x-on:htmx:after-settle="apply()">
    <th:block th:if="${platform}"><th:block th:replace="~{:: chain}"></th:block></th:block>
    <th:block th:replace="~{admin/tenant/audit-rows :: card}"></th:block>
  </div>
</th:block>

<div th:fragment="chain" id="audit-chain"
     x-data="{ running: false, startedAt: 0, elapsed: 0, timer: null,
               get startText() { return this.startedAt ? new Date(this.startedAt).toLocaleTimeString('en-GB', { timeZone: 'Asia/Seoul', hour12: false }) : ''; },
               begin() {
                 this.running = true; this.startedAt = Date.now(); this.elapsed = 0; clearInterval(this.timer);
                 this.timer = setInterval(() => {
                   if (!this.$root.isConnected) { clearInterval(this.timer); return; }
                   this.elapsed = Math.max(0, Math.floor((Date.now() - this.startedAt) / 1000));
                 }, 1000);
               },
               end() { this.running = false; clearInterval(this.timer); } }"
     th:attr="hx-get=${verifyUrl}"
     hx-disinherit="hx-target hx-swap hx-sync" hx-trigger="verify-run" hx-target="this" hx-swap="outerHTML" hx-sync="this:drop" hx-request='{"timeout": 120000}'
     x-on:htmx:before-request="if ($event.detail.elt === $el) begin()" x-on:htmx:after-request="if ($event.detail.elt === $el) end()">
  <section class="card">
    <div class="row" style="gap: 16px; padding: 16px 20px">
      <span aria-hidden="true" class="chain-ico" th:classappend="${chainResult != null and !chainResult.intact} ? 'chain-ico--bad' : 'chain-ico--ok'">
        <th:block th:replace="~{admin/fragments/icons :: shield(20)}"></th:block>
      </span>
      <div class="stack-1" style="gap: 2px; flex: 1 1 320px; min-width: 0">
        <div class="row" style="gap: 8px">
          <h2 class="card__title">감사 로그 위변조 검증</h2>
          <span class="badge" x-show="running" x-cloak>검증 중</span>
          <th:block th:if="${chainResult != null}">
            <span x-show="!running" th:classappend="${chainResult.intact} ? 'badge badge--success badge--dot' : 'badge badge--danger badge--dot'"
                  th:text="${chainResult.intact ? '위변조 0건' : '위변조 ' + chainResult.tampered + '건'}">위변조 0건</span>
          </th:block>
          <span class="badge badge--violet">PLATFORM 전용</span>
        </div>
        <p class="card__sub" th:text="${'감사 로그 행이 해시로 이어져 바뀌거나 지워지지 않았는지 확인합니다.' + (chainResult != null ? ' 마지막 검증 ' + chainResult.at + ' KST' : '')}">감사 로그 행이 해시로 이어져 바뀌거나 지워지지 않았는지 확인합니다.</p>
      </div>
      <a th:if="${chainResult != null and chainResult.intact}" class="btn" th:href="@{/admin/audit-chain}">월간 보고서</a>
      <button type="button" class="btn btn--primary" x-bind:disabled="running" x-on:click="$dispatch('dialog:open', { id: 'audit-verify' })">
        <span x-show="!running">검증 실행</span><span x-show="running" x-cloak>검증 중…</span>
      </button>
    </div>
  </section>
  <th:block th:replace="~{admin/fragments/ui/dialog :: dialog('audit-verify', '해시 체인 검증', ${tenantName + '의 감사 로그 전체를 검증합니다. 읽기 전용이며 데이터는 바뀌지 않습니다.'}, ~{:: verifyBody}, ~{:: verifyFooter}, null, null, null)}"></th:block>
</div>

<th:block th:fragment="verifyBody">
  <p style="margin: 0; font-size: 13px; color: var(--ink-2)">전체 체인 검증 — 처음부터 해시를 다시 계산해 확인합니다. 기간은 지정하지 않습니다.</p>
  <div class="stack-2" x-show="running" x-cloak>
    <div class="row">
      <strong style="font-size: 13px" role="status" aria-live="polite">검증 중…</strong>
      <div class="spacer"></div>
      <!-- 경과 시간은 매초 바뀌므로 aria-live 밖에 둔다 -->
      <span class="hint" style="margin: 0">시작 <span x-text="startText"></span> · 경과 <span x-text="elapsed"></span>초</span>
    </div>
    <div class="indet" role="progressbar" aria-label="검증 진행 중"></div>
  </div>
  <p class="hint" style="margin: 0">진행률을 알 수 없어 퍼센트를 표시하지 않습니다. 창을 닫아도 검증은 계속되고 결과는 위 카드에 표시됩니다.</p>
</th:block>

<th:block th:fragment="verifyFooter">
  <button type="button" class="btn" x-on:click="close()"><span x-text="running ? '닫기 (계속 실행)' : '취소'">취소</span></button>
  <button type="button" class="btn btn--primary" x-bind:disabled="running" x-on:click="$dispatch('verify-run')"><span x-text="running ? '검증 중…' : '검증 실행'">검증 실행</span></button>
</th:block>
</body>
</html>
