<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  자격 증명 상세 다이얼로그(← CredentialDetailDialog.tsx)와 회수 확인 다이얼로그(← CredentialsTab.tsx RevokeCredentialDialog).
    detail  GET …/credentials/{cid} — #cred-detail-slot 에 들어간다. 처음부터 열려 있다(dialog open=true).
            모델: c(Row), createdAt, lastUsedAt, transportsRaw, attestation, nav(null 이면 이동 UI 없음), revokeGetAttrs, retryAttrs, events, eventsError,
                  listOob(+ 목록 모델: 이웃 페이지로 넘어갔을 때 #cred-results OOB)
    revoke  GET …/credentials/{cid}/revoke-confirm — #cred-confirm-slot 에 들어간다. 올 때 바로 열린다(L3: 마지막 8자 입력).
  credential 데이터는 th:text 로만 쓴다(속성의 JS 평가 위치에는 넣지 않는다 — 확인 입력값은 base64url 로 검증한 id 꼬리).
-->
<th:block th:fragment="detail">
  <div ui:xdata="${@fmt.xdata('dialog', 'id', 'cred-detail', 'open', true)}"
       x-on:dialog:open.window="onOpen($event)" x-on:dialog:close.window="onClose($event)" x-on:keydown.escape.window="onEscape()">
    <template x-if="open">
      <div class="scrim" x-on:mousedown="onScrim($event)">
        <div class="dialog dialog--wide" role="dialog" aria-modal="true" aria-labelledby="cred-detail-title" x-trap.noscroll="open">
          <div class="dialog__head">
            <h3 class="dialog__title" id="cred-detail-title">
              <span class="row" style="gap: 10px; flex-wrap: nowrap">
                <span>Credential 상세</span>
                <th:block th:replace="~{admin/fragments/ui/statusBadge :: statusBadge('ACTIVE')}"></th:block>
                <th:block th:if="${nav != null}">
                  <span class="spacer"></span>
                  <span class="hint" style="margin: 0; font-weight: 400" th:text="${nav.position}">1 / 3</span>
                  <button th:if="${nav.prev != null}" type="button" class="icon-btn" aria-label="이전 credential" title="이전 credential"
                          ui:attrs="${nav.prev}" hx-target="#cred-detail-slot" hx-swap="innerHTML" hx-trigger="click" hx-sync="#cred-detail-slot:replace"><th:block th:replace="~{admin/fragments/icons :: chevronLeft(16)}"></th:block></button>
                  <button th:unless="${nav.prev != null}" type="button" class="icon-btn" aria-label="이전 credential" title="이전 credential" disabled><th:block th:replace="~{admin/fragments/icons :: chevronLeft(16)}"></th:block></button>
                  <button th:if="${nav.next != null}" type="button" class="icon-btn" aria-label="다음 credential" title="다음 credential"
                          ui:attrs="${nav.next}" hx-target="#cred-detail-slot" hx-swap="innerHTML" hx-trigger="click" hx-sync="#cred-detail-slot:replace"><th:block th:replace="~{admin/fragments/icons :: chevronRight(16)}"></th:block></button>
                  <button th:unless="${nav.next != null}" type="button" class="icon-btn" aria-label="다음 credential" title="다음 credential" disabled><th:block th:replace="~{admin/fragments/icons :: chevronRight(16)}"></th:block></button>
                </th:block>
              </span>
            </h3>
            <div class="dialog__sub">
              <span class="row" style="gap: 4px; flex-wrap: nowrap">
                <span class="mono truncate" style="font-size: 12px; color: var(--mute)" th:text="${c.id}">AbCd</span>
                <th:block th:replace="~{admin/fragments/ui/copyBtn :: copyBtn(${c.id}, 'credentialId 복사', true)}"></th:block>
              </span>
            </div>
          </div>
          <div class="dialog__body stack-4">
            <section class="dlg-sec">
              <span class="t-over">식별 정보</span>
              <dl class="kv kv--4">
                <dt>externalUserId</dt><dd class="mono" style="font-size: 12px" th:text="${c.userHandle}">user</dd>
                <dt>별칭</dt><dd th:text="${c.nickname != null} ? ${c.nickname} : '—'">—</dd>
                <dt>생성</dt><dd th:text="${createdAt}">2026-10-01 12:00</dd>
                <dt>마지막 사용</dt><dd th:text="${lastUsedAt}">3분 전</dd>
              </dl>
            </section>

            <section class="dlg-sec">
              <span class="t-over">인증기</span>
              <dl class="kv kv--4">
                <dt>인증기</dt><dd th:text="${authName != null} ? ${authName} : (${c.aaguid != null} ? ${c.aaguid} : 'unknown')">YubiKey</dd>
                <dt>전송 방식</dt>
                <dd>
                  <span th:if="${!transportsRaw.isEmpty()}" class="row" style="gap: 4px"><span th:each="t : ${transportsRaw}" class="tag" th:text="${t}">usb</span></span>
                  <th:block th:if="${transportsRaw.isEmpty()}">—</th:block>
                </dd>
                <dt>서명 카운터</dt><dd class="mono" style="font-size: 12px" th:text="${c.signCount}">0</dd>
                <dt>AAGUID</dt><dd class="mono" style="font-size: 12px" th:text="${c.aaguid != null} ? ${c.aaguid} : '—'">—</dd>
                <dt>attestation</dt><dd class="mono" style="font-size: 12px" th:text="${attestation != null} ? ${attestation} : '—'">—</dd>
              </dl>
            </section>

            <section class="dlg-sec">
              <span class="t-over">인증 기록 (최근 20건)</span>
              <th:block th:if="${eventsError != null}">
                <th:block th:replace="~{admin/fragments/ui/loadError :: loadError('인증 기록', ${eventsError}, ${detailRetryAttrs}, false, true)}"></th:block>
              </th:block>
              <p th:if="${eventsError == null and events.isEmpty()}" class="muted" style="margin: 0; padding: 20px 0; text-align: center; font-size: 13px">아직 인증 이력이 없습니다.</p>
              <div th:if="${eventsError == null and !events.isEmpty()}" style="border: 1px solid var(--line-soft); border-radius: var(--r); overflow: hidden">
                <table class="table">
                  <thead><tr><th>시간</th><th>결과</th><th>사유</th><th class="num">서명 카운터</th></tr></thead>
                  <tbody>
                    <tr th:each="e : ${events}">
                      <td style="font-size: 13px; color: var(--ink-2)" th:text="${e.when}">2026-10-01 12:00</td>
                      <td><span class="badge" th:classappend="${e.result == 'SUCCESS'} ? 'badge--success' : 'badge--danger'" th:text="${e.result == 'SUCCESS'} ? '성공' : '실패'">성공</span></td>
                      <td><span th:if="${e.reason != null and e.reason != ''}" class="tag" th:text="${e.reason}">사유</span><span th:unless="${e.reason != null and e.reason != ''}" class="muted">—</span></td>
                      <td class="num mono" style="font-size: 12px" th:text="${e.signCount}">1</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
          <div class="dialog__foot">
            <div class="dialog__foot-start">
              <!-- 회수 확인은 다른 자리(#cred-confirm-slot)에 열린다. 요청이 성공하면 이 상세를 닫는다(원본: setSelected(null) 뒤 확인 열기). -->
              <button type="button" class="btn btn--danger" ui:attrs="${revokeGetAttrs}"
                      x-on:htmx:after-request="if ($event.detail.successful) close()">Credential 회수…</button>
            </div>
            <button type="button" class="btn" autofocus x-on:click="close()">닫기</button>
          </div>
        </div>
      </div>
    </template>
  </div>
  <!-- 이웃 페이지로 넘어간 이동이면 그 페이지의 목록도 함께 갱신한다 -->
  <th:block th:if="${listOob}">
    <th:block th:replace="~{admin/tenant/credential-rows :: results}"></th:block>
    <th:block th:replace="~{admin/tenant/credential-rows :: controls(true)}"></th:block>
  </th:block>
</th:block>

<!-- 회수 확인(L3): 마지막 8자를 입력해야 확인 버튼이 켜진다. 응답이 오면 바로 열리도록 한 번 열기 이벤트를 보낸다. -->
<th:block th:fragment="revoke">
  <div x-data x-init="$nextTick(() => $dispatch('dialog:open', { id: 'cred-revoke' }))">
    <th:block th:replace="~{admin/fragments/ui/confirmDialog :: confirmDialog('cred-revoke', 'L3', 'Credential을 회수할까요?', '회수', '이 사용자는 해당 패스키로 더 이상 로그인할 수 없습니다. 되돌릴 수 없습니다.', ~{admin/tenant/credential-detail :: revokeBody}, null, ${c.tail8}, ${typeLabel}, null, ${confirmAttrs})}"></th:block>
  </div>
</th:block>

<th:block th:remove="all">
  <th:block th:fragment="revokeBody">
    <dl class="kv" style="grid-template-columns: 100px minmax(0, 1fr)">
      <dt>credentialId</dt><dd class="mono" style="font-size: 12px" th:text="${'…' + c.tail8}">…12345678</dd>
      <dt>사용자</dt><dd class="mono" style="font-size: 12px" th:text="${c.userHandle}">user</dd>
      <dt>인증기</dt><dd th:text="${c.authenticator}">YubiKey</dd>
    </dl>
  </th:block>
</th:block>
</body>
</html>
