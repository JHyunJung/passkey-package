<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  자격 증명 탭(← pages/tenant/CredentialsTab.tsx). 탭 조각 GET /admin/_/tenants/{id}/tab/credentials.
  모델: tid, (credential-rows 의 목록 모델 전부)
  #cred-root 안: #cred-card(검색·필터·CSV·#cred-results 목록), #cred-detail-slot(행 클릭 = 상세 다이얼로그), #cred-confirm-slot(회수 확인 다이얼로그).
  검색·필터·페이징 요청은 #tenant-tab 이 아니라 #cred-results 만 교체한다(card 의 hx-sync 로 늦은 응답이 새 응답을 덮지 않는다).
-->
<th:block th:fragment="tab">
  <div id="cred-root" class="stack-6">
    <section class="card" id="cred-card" x-data="{ filtersOpen: false }" hx-sync="this:replace">
      <div class="card__head">
        <div class="search" style="flex: 0 1 340px">
          <th:block th:replace="~{admin/fragments/icons :: search(15)}"></th:block>
          <th:block th:replace="~{admin/tenant/credential-rows :: searchInput(false)}"></th:block>
        </div>
        <th:block th:replace="~{admin/tenant/credential-rows :: controls(false)}"></th:block>
      </div>
      <th:block th:replace="~{admin/tenant/credential-rows :: panel(false)}"></th:block>
      <th:block th:replace="~{admin/tenant/credential-rows :: results}"></th:block>
    </section>
    <div id="cred-detail-slot"></div>
    <div id="cred-confirm-slot"></div>
  </div>
</th:block>
</body>
</html>
