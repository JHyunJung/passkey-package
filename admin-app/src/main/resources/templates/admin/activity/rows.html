<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  활동 화면의 조각(← ActivityPage.tsx). 전체 페이지(page.html)와 GET /admin/_/activity/** 가 같은 조각을 그린다.
    rows      필터 변경·다시 시도 응답: #activity-main 안쪽(main) + OOB(KPI·적용된 필터·활발한 tenant·숨은 상태) + reset 된 컨트롤
    poll      폴링·새로고침 응답(hx-swap=none): OOB 만 — 새 행을 #activity-feed 앞에 붙이고 KPI·(바뀌었을 때만) 활발한 tenant·숨은 상태
    more      더 보기 응답(hx-swap=none): 오래된 행을 #activity-feed 뒤에 붙이고 아래쪽 커서를 갱신
  행위자 이메일·tenant 이름·액션 문자열은 사용자가 정할 수 있는 값이라 th:text 로만 그린다. 속성 중 JS 로 평가되는 곳에는 서버가 만든 UUID(data-id)만 간다.
  숨은 상태 입력(가장 새 행 id·아래쪽 커서·날짜 머리글 라벨·loaded)은 다음 폴링·더 보기 요청이 hx-include 로 싣는다.
-->

<th:block th:fragment="rows">
  <th:block th:replace="~{:: main}"></th:block>
  <th:block th:replace="~{:: kpis(true)}"></th:block>
  <th:block th:replace="~{:: applied(true)}"></th:block>
  <th:block th:replace="~{:: tenantsCard(true)}"></th:block>
  <th:block th:replace="~{:: state(true)}"></th:block>
  <th:block th:if="${resetCategory}"><th:block th:replace="~{:: seg(true)}"></th:block></th:block>
  <th:block th:if="${resetTenant}"><th:block th:replace="~{:: tenantSelect(true)}"></th:block></th:block>
</th:block>

<th:block th:fragment="poll">
  <!-- 같은 KST 날짜의 그룹이 이미 있으면 그 그룹의 행 목록 앞에, 새 날짜면 새 그룹을 목록 맨 위에 -->
  <div th:if="${freshSame != null}" th:attr="hx-swap-oob=${'afterbegin:#day-' + freshSame.key + '-rows'}"><th:block th:replace="~{:: rowsOnly(${freshSame.events})}"></th:block></div>
  <div th:if="${not #lists.isEmpty(freshNew)}" hx-swap-oob="afterbegin:#activity-feed"><th:block th:replace="~{:: groups(${freshNew})}"></th:block></div>
  <div th:if="${clearEmpty}" id="activity-empty" hx-swap-oob="delete"></div>
  <input th:if="${topId != null}" type="hidden" id="activity-newest" name="top" th:value="${topId}" hx-swap-oob="true">
  <input th:if="${topDay != null}" type="hidden" id="activity-newest-day" name="day" th:value="${topDay}" hx-swap-oob="true">
  <th:block th:if="${bottomState}">
    <input type="hidden" id="activity-before" name="before" th:value="${beforeIso}" hx-swap-oob="true">
    <input type="hidden" id="activity-before-id" name="beforeId" th:value="${beforeId}" hx-swap-oob="true">
    <input type="hidden" id="activity-last-day" name="lastDay" th:value="${lastDay}" hx-swap-oob="true">
  </th:block>
  <th:block th:replace="~{:: kpis(true)}"></th:block>
  <th:block th:if="${topChanged}"><th:block th:replace="~{:: tenantsCard(true)}"></th:block></th:block>
</th:block>

<th:block th:fragment="more">
  <div th:if="${moreSame != null}" th:attr="hx-swap-oob=${'beforeend:#day-' + moreSame.key + '-rows'}"><th:block th:replace="~{:: rowsOnly(${moreSame.events})}"></th:block></div>
  <div th:if="${not #lists.isEmpty(moreNew)}" hx-swap-oob="beforeend:#activity-feed"><th:block th:replace="~{:: groups(${moreNew})}"></th:block></div>
  <th:block th:if="${hasRaw}">
    <input type="hidden" id="activity-before" name="before" th:value="${beforeIso}" hx-swap-oob="true">
    <input type="hidden" id="activity-before-id" name="beforeId" th:value="${beforeId}" hx-swap-oob="true">
    <input type="hidden" id="activity-last-day" name="lastDay" th:value="${lastDay}" hx-swap-oob="true">
  </th:block>
</th:block>

<!-- 숨은 상태. 전체 교체(oob=true)는 래퍼째, 폴링·더 보기는 개별 입력만 OOB 로 바꾼다. -->
<div th:fragment="state(oob)" id="activity-state" hidden th:attr="hx-swap-oob=${oob} ? 'true' : null">
  <input type="hidden" id="activity-cat" name="category" th:value="${category}">
  <input type="hidden" id="activity-loaded" name="loaded" th:value="${loaded} ? '1' : '0'">
  <input type="hidden" id="activity-newest" name="top" th:value="${topId}">
  <input type="hidden" id="activity-newest-day" name="day" th:value="${topDay}">
  <input type="hidden" id="activity-before" name="before" th:value="${beforeIso}">
  <input type="hidden" id="activity-before-id" name="beforeId" th:value="${beforeId}">
  <input type="hidden" id="activity-last-day" name="lastDay" th:value="${lastDay}">
</div>

<!-- KPI. 응답 전·실패 시 값은 0 이 아니라 "—". 서버가 p95Ms 를 주지 않으면(현재 항상 null) 카드 3개. -->
<div th:fragment="kpis(oob)" id="activity-kpis" class="kpis" th:classappend="${kpiP95 == null} ? 'kpis--3'" th:attr="hx-swap-oob=${oob} ? 'true' : null">
  <div class="kpi"><span class="kpi__label">활동 (24h)</span><span class="kpi__value" th:text="${kpiEvents}">0</span></div>
  <div class="kpi"><span class="kpi__label">운영 액션 (24h)</span><span class="kpi__value" th:text="${kpiOps}">0</span></div>
  <div class="kpi"><span class="kpi__label">보안 이벤트 (24h)</span><span class="kpi__value"><span th:style="${kpiSecurityBad} ? 'color: var(--bad)'" th:text="${kpiSecurity}">0</span></span></div>
  <div class="kpi" th:if="${kpiP95 != null}"><span class="kpi__label">평균 응답</span><span class="kpi__value" th:text="${kpiP95}">0ms</span><span class="kpi__hint" th:text="${kpiP95Hint}">p95</span></div>
</div>

<!-- 카테고리 세그먼트. 선택은 클라이언트에서 바로 바뀌고 요청은 URL 의 category 를 싣는다(OOB 는 칩 제거·모두 지우기 때만). -->
<div th:fragment="seg(oob)" id="activity-seg" style="display: contents" th:attr="hx-swap-oob=${oob} ? 'true' : null">
  <th:block th:replace="~{admin/fragments/ui/segmented :: segmented(null, ${segOptions}, ${category}, '카테고리')}"></th:block>
</div>

<div th:fragment="tenantSelect(oob)" id="activity-tenant-wrap" style="display: contents" th:attr="hx-swap-oob=${oob} ? 'true' : null">
  <select id="activity-tenant" name="tenantId" class="input" aria-label="테넌트" style="width: 200px" ui:attrs="${tenantAttrs}">
    <option value="" th:selected="${tenantIdValue == ''}">테넌트 · 전체</option>
    <option th:each="t : ${tenantOptions}" th:value="${t.id}" th:selected="${t.selected}" th:text="${t.label}">Acme (acme)</option>
  </select>
</div>

<!-- 액션 검색: 원본처럼 읽어 온 행을 클라이언트에서 거른다(서버 왕복 없음, 더 보기로 불러온 행 유지). 응답이 다시 그리지 않는다. -->
<div th:fragment="qInput(oob)" id="activity-q-wrap" style="display: contents">
  <input id="activity-q" type="search" class="input" aria-label="액션 검색" placeholder="액션 검색…" autocomplete="off"
         x-on:input="applyFilter()" x-on:search="applyFilter()">
</div>

<!-- 적용된 필터: 카테고리·tenant 칩은 서버(OOB), 검색어 칩은 Alpine(qv). 행 전체는 둘 중 하나라도 있을 때만 보인다. -->
<div th:fragment="applied(oob)" id="activity-applied" th:attr="hx-swap-oob=${oob} ? 'true' : null">
  <div class="row" style="gap: 8px" th:attr="data-server=${hasApplied}" x-cloak x-show="$el.dataset.server === 'true' || qv !== ''">
    <span class="muted" style="font-size: 12px">적용된 필터</span>
    <th:block th:if="${category != 'all'}"><th:block
              th:replace="~{admin/fragments/ui/chips :: removableChip(${'카테고리: ' + categoryLabel}, '카테고리 필터 제거', null, false, false, ${chipCategoryAttrs})}"></th:block></th:block>
    <th:block th:if="${tenantSlug != null}"><th:block
              th:replace="~{admin/fragments/ui/chips :: removableChip(${'테넌트: ' + tenantSlug}, '테넌트 필터 제거', null, false, false, ${chipTenantAttrs})}"></th:block></th:block>
    <span class="chip" x-cloak x-show="qv !== ''">
      <span class="truncate" x-text="'액션: ' + qv"></span>
      <button type="button" class="chip__x" aria-label="액션 검색 제거" x-on:click="clearQ()"><th:block th:replace="~{admin/fragments/icons :: x(12)}"></th:block></button>
    </span>
    <button type="button" class="btn btn--ghost btn--sm" ui:attrs="${clearAttrs}" x-on:click="clearQ()">모두 지우기</button>
  </div>
</div>

<!-- 목록 영역. 첫 응답 실패는 "이벤트 없음"과 구분되는 오류 카드(role=alert, 토스트 중복 없음). -->
<th:block th:fragment="main">
  <section class="card" th:unless="${loaded}">
    <th:block th:replace="~{admin/fragments/ui/loadError :: loadError('활동', ${loadError}, ${retryAttrs}, false, false)}"></th:block>
  </section>
  <section class="card" id="activity-feed-card" th:if="${loaded}">
    <div class="card__head">
      <h2 class="card__title">최근 이벤트</h2>
      <div class="spacer"></div>
      <span class="row muted" style="gap: 12px; font-size: 12px">
        <span class="row" style="gap: 5px"><span class="dot" aria-hidden="true" style="background: var(--bad)"></span>보안 실패</span>
        <span class="row" style="gap: 5px"><span class="dot" aria-hidden="true" style="background: var(--warn-dot)"></span>운영 변경</span>
        <span class="row" style="gap: 5px"><span class="dot" aria-hidden="true" style="background: var(--brand-700)"></span>인증</span>
        <span class="row" style="gap: 5px"><span class="dot" aria-hidden="true" style="background: var(--faint)"></span>시스템</span>
      </span>
    </div>
    <div id="activity-feed"><th:block th:replace="~{:: groups(${days})}"></th:block></div>
    <!-- 읽어 온 행은 있는데 검색어에 맞는 행이 없을 때(클라이언트 판정) -->
    <div id="activity-nomatch" x-cloak x-show="noMatch">
      <th:block th:replace="~{admin/fragments/ui/emptyState :: emptyState('/admin/img/no-results.webp', ${emptyTitle}, '필터를 바꾸거나 이전 24시간을 더 불러오세요.', null, true)}"></th:block>
    </div>
    <div id="activity-empty" th:if="${#lists.isEmpty(days)}">
      <th:block th:replace="~{admin/fragments/ui/emptyState :: emptyState('/admin/img/no-results.webp', ${emptyTitle}, '필터를 바꾸거나 이전 24시간을 더 불러오세요.', null, true)}"></th:block>
    </div>
    <div class="card__foot" style="justify-content: center">
      <button type="button" class="btn" id="activity-more" ui:attrs="${moreAttrs}" x-bind:disabled="rowsBusy || stale">이전 24시간 더 보기</button>
    </div>
  </section>
</th:block>

<!-- 날짜 그룹(원본 groupByDay: KST 날짜). role=group aria-label=라벨, 키는 KST yyyy-MM-dd 라 폴링·더 보기가 같은 날짜 그룹의 행 목록에 이어 붙는다. -->
<th:block th:fragment="groups(days)">
  <div th:each="g : ${days}" class="feed-group" role="group" th:attr="aria-label=${g.label}, data-day=${g.key}" th:id="${'day-' + g.key}">
    <div class="t-over feed-day" th:text="${g.label}">오늘</div>
    <div th:id="${'day-' + g.key + '-rows'}"><th:block th:replace="~{:: rowsOnly(${g.events})}"></th:block></div>
  </div>
</th:block>

<th:block th:fragment="rowsOnly(events)">
  <div th:each="e : ${events}" class="row feed-row" th:attr="data-id=${e.id}, data-type=${e.typeUpper}, data-label=${e.typeTitle}"
       x-bind:class="{ 'feed-row--sel': selectedId === $el.dataset.id }" x-bind:aria-current="selectedId === $el.dataset.id ? 'true' : null">
    <span class="mono muted feed-row__time" th:text="${e.hm}">11:48</span>
    <span class="dot feed-row__dot" aria-hidden="true" th:style="${'background: ' + e.toneVar}"></span>
    <div class="col feed-row__body">
      <div class="row" style="gap: 8px">
        <span class="tag" th:title="${e.typeTitle}" th:text="${e.type}">TENANT_UPDATE</span>
        <a th:if="${e.tenantUrl != null}" class="btn btn--ghost btn--xs" th:href="${e.tenantUrl}" th:text="${e.tenantName}">acme</a>
        <span th:if="${e.tenantUrl == null}" class="muted" style="font-size: 13px">플랫폼</span>
      </div>
      <span class="feed-row__sentence" th:text="${e.sentence}">op@x.com 님이 acme 테넌트에 …</span>
    </div>
    <button type="button" class="icon-btn" aria-label="상세 열기" title="상세 열기" th:attr="data-id=${e.id}"
            x-on:click="openDetail($el.dataset.id)" ui:attrs="${e.detailAttrs}"><th:block th:replace="~{admin/fragments/icons :: chevronRight(16)}"></th:block></button>
  </div>
</th:block>

<!-- 활발한 Tenant(24h). 폴링은 목록이 바뀌었을 때만 이 카드를 다시 그린다(포커스·눌러 둔 버튼 보존). 서명 입력은 카드와 함께 교체된다. -->
<section th:fragment="tenantsCard(oob)" id="activity-tenants-card" class="card" th:attr="hx-swap-oob=${oob} ? 'true' : null">
  <input type="hidden" id="activity-tenants-sig" name="topSig" th:value="${topSig}">
  <div class="card__head">
    <h2 class="card__title">활발한 Tenant</h2>
    <span class="muted" style="font-size: 12px">24h</span>
  </div>
  <p class="muted" style="margin: 0; padding: 16px 20px; font-size: 13px" th:if="${#lists.isEmpty(top)}">최근 24시간 이벤트가 없습니다.</p>
  <button th:each="t : ${top}" type="button" class="row top-row" th:classappend="${t.selected} ? 'top-row--sel'"
          th:aria-pressed="${t.selected}" ui:attrs="${t.attrs}">
    <span class="avatar avatar--sq" aria-hidden="true" style="width: 28px; height: 28px; font-size: 12px" th:text="${t.initial}">A</span>
    <span class="col" style="flex: 1 1 0; min-width: 0">
      <span class="truncate" style="font-size: 13px; font-weight: 500" th:text="${t.name}">acme</span>
      <span class="mono muted" style="font-size: 12px" th:text="${t.slug}">acme</span>
    </span>
    <span aria-hidden="true" style="width: 64px; height: 6px; border-radius: 3px; background: var(--line-soft); flex: none">
      <span class="top-row__bar" th:style="${'width: ' + t.pct + '%'}"></span>
    </span>
    <span style="font-size: 13px; font-weight: 600; width: 40px; text-align: right" th:text="${t.count}">3</span>
  </button>
</section>
</body>
</html>
