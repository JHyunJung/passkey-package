<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  새 비밀번호 설정(← pages/ResetPasswordPage.tsx). 메일 링크의 ?token= 으로 진입한다.
  card 조각의 상태(state): form | invalid(토큰 없음) | expired(토큰 거부) | done.
  제출: hx-post /admin/reset-password(token, password, password2, _csrf) → #auth-card 교체.
  토큰은 폼의 hidden 값으로만 오간다(URL·로그·응답 헤더에 되풀이하지 않는다 — 컨트롤러가 no-store·no-referrer 를 건다).
  비밀번호는 응답에 다시 그리지 않는다.
-->
<head th:replace="~{admin/auth/head :: head('비밀번호 재설정')}"></head>
<body>
<main class="auth">
  <div class="auth__col">
    <img class="auth__logo" th:src="@{/admin/img/crosscert-logo-transparent.png}" alt="CROSSCERT">
    <div class="auth-card" id="auth-card" th:fragment="card">
      <th:block th:if="${state == 'invalid' or state == 'expired'}">
        <div class="banner banner--warning banner--top" role="status">
          <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: alert(18)}"></th:block></span>
          <div class="banner__body">
            <div class="banner__title">링크를 사용할 수 없습니다</div>
            <div th:if="${state == 'expired'}">링크가 만료되었거나 이미 사용되었습니다. 보안을 위해 재설정 링크는 정해진 시간 안에 한 번만 쓸 수 있습니다.</div>
            <div th:if="${state == 'invalid'}">유효하지 않은 링크입니다. 만료됐거나 이미 사용된 링크일 수 있습니다.</div>
          </div>
        </div>
        <a class="btn btn--primary" href="/admin/forgot-password">재설정 링크 다시 받기</a>
      </th:block>
      <th:block th:if="${state == 'done'}">
        <div class="banner banner--success banner--top" role="status">
          <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: check(18)}"></th:block></span>
          <div class="banner__body">
            <div class="banner__title">변경 완료</div>
            <div>비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.</div>
          </div>
        </div>
        <a class="btn btn--primary" href="/admin">로그인 →</a>
      </th:block>
      <form th:if="${state == 'form'}" class="col" style="gap: 20px;" novalidate
            hx-post="/admin/reset-password" hx-target="#auth-card" hx-swap="outerHTML" hx-sync="this:drop"
            x-data="resetForm"
            x-on:htmx:before-request="onBefore($event)" x-on:htmx:after-request="onAfter($event)"
            x-on:htmx:send-error="onNetworkError()" x-on:htmx:timeout="onNetworkError()">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">
        <div class="col" style="gap: 6px;">
          <h1 class="page__title">새 비밀번호 설정</h1>
          <p class="card__sub">12자 이상으로 새 비밀번호를 입력하세요.</p>
        </div>
        <template x-if="failure">
          <div class="banner banner--danger banner--top" role="alert">
            <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: alert(18)}"></th:block></span>
            <div class="banner__body">
              <div class="banner__title">비밀번호를 바꾸지 못했습니다.</div>
              <div>서버가 응답하지 않습니다. 입력한 내용은 그대로 있습니다.<span class="mono" style="display: block; font-size: 11px;" x-show="status !== null" x-text="'HTTP ' + status"></span></div>
            </div>
            <div class="banner__actions"><button type="button" class="btn btn--sm" x-bind:disabled="!canSubmit()" x-on:click="$root.requestSubmit()">다시 시도</button></div>
          </div>
        </template>
        <div>
          <label class="label" for="reset-pw">새 비밀번호</label>
          <input id="reset-pw" name="password" class="input input--lg" type="password" autofocus autocomplete="new-password"
                 aria-describedby="reset-pw-meter" x-model="pw" x-bind:readonly="submitting"
                 x-bind:aria-invalid="tooShort() ? 'true' : 'false'" aria-invalid="false">
          <div id="reset-pw-meter" class="row" style="gap: 6px; margin-top: 8px; flex-wrap: nowrap;">
            <template x-for="i in [0, 1, 2]" x-bind:key="i">
              <span aria-hidden="true" style="flex: 1 1 0; height: 4px; border-radius: 2px; background: var(--line);" x-bind:style="{ background: segColor(i) }"></span>
            </template>
            <span class="hint" style="margin: 0; flex: none;" x-bind:style="{ color: (pw.length > 0 && pw.length < min) ? 'var(--bad)' : '' }"
                  x-text="pw.length >= min ? '12자 이상 충족' : '12자 이상'">12자 이상</span>
          </div>
          <p class="field__error" th:if="${errors != null and errors['password'] != null}" th:text="${errors['password']}">오류</p>
        </div>
        <div>
          <label class="label" for="reset-pw2">새 비밀번호 확인</label>
          <input id="reset-pw2" name="password2" class="input input--lg" type="password" autocomplete="new-password"
                 aria-describedby="reset-pw2-error" x-model="pw2" x-bind:readonly="submitting"
                 x-bind:aria-invalid="mismatch() ? 'true' : 'false'" aria-invalid="false">
          <p class="field__error" id="reset-pw2-error" x-show="mismatch()" x-cloak>비밀번호가 일치하지 않습니다.</p>
          <p class="field__error" th:if="${errors != null and errors['password2'] != null}" th:text="${errors['password2']}">오류</p>
        </div>
        <div th:if="${message}" class="banner banner--danger" role="alert">
          <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: alert(18)}"></th:block></span>
          <div class="banner__body"><div th:text="${message}">비밀번호 변경에 실패했습니다.</div></div>
        </div>
        <button type="submit" class="btn btn--primary btn--lg" x-ref="submit" x-bind:disabled="!canSubmit()"
                x-text="submitting ? '변경 중…' : '비밀번호 변경'">비밀번호 변경</button>
      </form>
    </div>
    <a href="/admin" style="font-size: 13px; font-weight: 600;">← 로그인으로</a>
  </div>
</main>
</body>
</html>
