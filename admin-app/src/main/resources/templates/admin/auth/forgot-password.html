<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  비밀번호 찾기(← pages/ForgotPasswordPage.tsx). 로그인 전 화면이라 login/mfa 와 같은 단독 페이지(공통 틀 없음).
  제출: hx-post /admin/forgot-password(email, _csrf) → #auth-card 를 card 조각으로 교체.
  계정 열거 방지: 가입 여부와 상관없이 같은 "메일을 확인하세요" 완료 카드. 보내지 못한 경우(5xx·네트워크)만 실패로 알리고 입력을 유지한다.
-->
<head th:replace="~{admin/auth/head :: head('비밀번호 재설정')}"></head>
<body>
<main class="auth">
  <div class="auth__col">
    <img class="auth__logo" th:src="@{/admin/img/crosscert-logo-transparent.png}" alt="CROSSCERT">
    <div class="auth-card" id="auth-card" th:fragment="card">
      <div class="col" style="gap: 6px;">
        <h1 class="page__title">비밀번호 재설정</h1>
        <p class="card__sub" th:if="${sent}">가입한 이메일을 입력하면 재설정 링크를 보내드립니다.</p>
        <p class="card__sub" th:unless="${sent}">가입한 이메일을 입력하면 재설정 링크를 보내드립니다. 링크는 일정 시간 후 만료됩니다.</p>
      </div>
      <th:block th:if="${sent}">
        <div class="banner banner--success banner--top" role="status">
          <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: check(18)}"></th:block></span>
          <div class="banner__body">
            <div class="banner__title">메일을 확인하세요</div>
            <div>해당 이메일로 가입된 계정이 있으면 재설정 링크가 발송됩니다.</div>
          </div>
        </div>
        <p class="hint" style="margin: 0;">메일이 오지 않으면 스팸함을 확인하거나 플랫폼 운영자에게 문의하세요.</p>
      </th:block>
      <form th:unless="${sent}" class="col" style="gap: 20px;" method="post" action="/admin/forgot-password" novalidate
            hx-post="/admin/forgot-password" hx-target="#auth-card" hx-swap="outerHTML" hx-sync="this:drop"
            x-data="forgotForm"
            x-on:htmx:before-request="onBefore($event)" x-on:htmx:after-request="onAfter($event)"
            x-on:htmx:send-error="onNetworkError()" x-on:htmx:timeout="onNetworkError()">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <template x-if="rejected">
          <div class="banner banner--danger banner--top" role="alert">
            <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: alert(18)}"></th:block></span>
            <div class="banner__body">
              <div class="banner__title">요청이 거부되었습니다.</div>
              <div>보안 토큰이 만료되었을 수 있습니다. 페이지를 새로 고친 뒤 다시 시도하세요. <span class="mono" style="display: block; font-size: 11px;" x-text="'HTTP ' + status"></span></div>
            </div>
            <div class="banner__actions"><button type="button" class="btn btn--sm" x-on:click="window.location.reload()">새로 고침</button></div>
          </div>
        </template>
        <template x-if="failure">
          <div class="banner banner--danger banner--top" role="alert">
            <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: alert(18)}"></th:block></span>
            <div class="banner__body">
              <div class="banner__title">요청을 보내지 못했습니다.</div>
              <div>네트워크 또는 서버 문제입니다. 메일은 발송되지 않았습니다. 잠시 후 다시 시도하세요.<span class="mono" style="display: block; font-size: 11px;" x-show="status !== null" x-text="'HTTP ' + status"></span></div>
            </div>
          </div>
        </template>
        <div>
          <label class="label" for="forgot-email">이메일</label>
          <input id="forgot-email" name="email" class="input input--lg" type="email" autofocus autocomplete="username" placeholder="you@crosscert.com"
                 x-model="email" x-bind:readonly="submitting"
                 th:attr="aria-invalid=${emailError} ? 'true' : null, aria-describedby=${emailError} ? 'forgot-email-error' : null">
          <p class="field__error" id="forgot-email-error" th:if="${emailError}" th:text="${emailError}">이메일을 입력하세요.</p>
          <p class="hint" x-show="failure" x-cloak>입력한 이메일은 그대로 있습니다.</p>
        </div>
        <button type="submit" class="btn btn--primary btn--lg" x-ref="submit" x-bind:disabled="!canSubmit()"
                x-text="submitting ? '전송 중…' : (failure ? '다시 시도' : '재설정 링크 보내기')">재설정 링크 보내기</button>
      </form>
    </div>
    <a href="/admin" style="font-size: 13px; font-weight: 600;">← 로그인으로</a>
  </div>
</main>
</body>
</html>
