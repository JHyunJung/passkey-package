<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  키보드 단축키 시트(← extras/ShortcutSheet.tsx, useHelpShortcut.ts)
  th:replace="~{admin/fragments/shell/shortcut-sheet :: sheet}"   (레이아웃에 한 번)
  `open-shortcuts` 이벤트(상단 바 도움말 메뉴·팔레트 항목, `?` 키는 app.js)를 받아 Task 3 의 dialog(id=shortcut-sheet)를 연다.
  실제로 동작하는 단축키만 나열한다. G 이동 4줄은 PLATFORM 에게만(useGoShortcuts 도 PLATFORM 에게만 켜진다 — app.js 는 data-go-shortcuts 로 판단).
  팔레트 단축키 표기는 OS 에 맞게(platformKey): Mac 은 ⌘K + "Windows · Ctrl K", 그 밖은 Ctrl K + "Mac · ⌘K". 서버 렌더는 Ctrl K.
-->
<div th:fragment="sheet" th:attr="data-go-shortcuts=${me != null and me.platform} ? 'true' : null" x-data x-on:open-shortcuts.window="$dispatch('dialog:open', { id: 'shortcut-sheet' })">
  <th:block th:replace="~{admin/fragments/ui/dialog :: dialog('shortcut-sheet', '키보드 단축키', null, ~{::table.shortcut-table}, ~{::button.shortcut-close}, ~{::span.shortcut-note}, null, null)}"></th:block>
  <!-- 조각 인자 원본(아래 세 요소를 dialog 가 가져간다). 화면에는 dialog 안쪽에서만 그려진다. -->
  <th:block th:remove="all">
    <table class="table shortcut-table">
      <caption class="sr-only">키보드 단축키 목록</caption>
      <tbody>
        <tr>
          <td style="width: 180px" x-data="platformKey">
            <kbd x-text="key">Ctrl K</kbd>
            <span class="hint" style="margin: 0 0 0 8px" x-text="key === '⌘K' ? 'Windows · Ctrl K' : 'Mac · ⌘K'">Mac · ⌘K</span>
          </td>
          <td>명령 팔레트 열기</td>
        </tr>
        <th:block th:if="${me != null and me.platform}">
          <tr><td style="width: 180px"><kbd>G T</kbd></td><td>Tenants 목록으로 이동</td></tr>
          <tr><td style="width: 180px"><kbd>G A</kbd></td><td>활동으로 이동</td></tr>
          <tr><td style="width: 180px"><kbd>G C</kbd></td><td>감사 체인으로 이동</td></tr>
          <tr><td style="width: 180px"><kbd>G S</kbd></td><td>설정으로 이동</td></tr>
        </th:block>
        <tr><td style="width: 180px"><kbd>?</kbd></td><td>이 단축키 목록</td></tr>
        <tr><td style="width: 180px"><kbd>← →</kbd></td><td>탭 사이 이동</td></tr>
        <tr><td style="width: 180px"><kbd>Enter</kbd></td><td>표에서 선택한 행 열기</td></tr>
        <tr><td style="width: 180px"><kbd>Esc</kbd></td><td>다이얼로그 · 메뉴 닫기</td></tr>
      </tbody>
    </table>
    <span class="hint shortcut-note" style="margin: 0">입력란에 포커스가 있으면 G · ? 단축키는 동작하지 않습니다.</span>
    <button type="button" class="btn shortcut-close" x-on:click="close()">닫기</button>
  </th:block>
</div>
</body>
</html>
