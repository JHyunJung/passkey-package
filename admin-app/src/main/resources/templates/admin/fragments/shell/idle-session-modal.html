<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  유휴 세션 모달(← extras/IdleSessionModal.tsx)
  th:replace="~{admin/fragments/shell/idle-session-modal :: modal}"   (레이아웃에 한 번, 로그인 상태에서만)
  모델: me.sessionIdleTimeoutMinutes. 타이머·카운트다운·연장·만료 로그아웃은 app.js 의 Alpine.data('idleSession').
  경고 시점 = max(전체 - 60초, 10초) 뒤, 카운트다운 = 전체 - 경고 시점(최소 1초). "세션 연장"은 GET /admin/api/me.
  만료·"로그아웃"은 숨은 폼(POST /admin/logout + CSRF)을 제출한다 — 로그아웃은 Spring Security 에서 POST 다.
  기본 포커스는 "세션 연장"(Enter 를 눌러도 작업이 사라지지 않게). 닫을 수 없는 alertdialog(Esc·스크림 무시).
-->
<div th:fragment="modal" th:if="${me != null}" x-data="idleSession" th:attr="data-minutes=${me.sessionIdleTimeoutMinutes}">
  <form id="idle-logout-form" method="post" th:action="@{/admin/logout}" hx-boost="false" hidden></form>
  <template x-if="open">
    <div class="scrim">
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="idle-title" x-trap.noscroll="open">
        <div class="dialog__head dialog__head--icon">
          <span class="dialog__icon">
            <span class="idle-ring">
              <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="32" cy="32" r="28" fill="none" stroke="var(--line-soft)" stroke-width="6"></circle>
                <circle cx="32" cy="32" r="28" fill="none" stroke-width="6" stroke-linecap="round" class="idle-ring__arc"
                        x-bind:stroke="tone" x-bind:stroke-dasharray="ring + ' ' + ring" x-bind:stroke-dashoffset="ringOffset" transform="rotate(-90 32 32)"></circle>
              </svg>
              <span class="mono idle-ring__text" aria-hidden="true" x-text="secondsLeft + '초'"></span>
            </span>
          </span>
          <div class="dialog__head-text">
            <h3 class="dialog__title" id="idle-title">세션이 곧 만료됩니다</h3>
            <div class="dialog__sub" x-text="secondsLeft + '초 후 자동으로 로그아웃됩니다.'"></div>
          </div>
        </div>
        <div class="dialog__body">
          <div class="stack-3">
            <div class="idle-progress" role="progressbar" aria-label="세션 만료까지 남은 시간" aria-valuemin="0"
                 x-bind:aria-valuemax="countdown" x-bind:aria-valuenow="secondsLeft" x-bind:aria-valuetext="secondsLeft + '초 남음'">
              <span class="idle-progress__bar" x-bind:style="{ width: (pct * 100) + '%', background: tone }"></span>
            </div>
            <p class="dialog__text idle-copy">보안 정책에 따라 <span x-text="minutes">30</span>분 동안 활동이 없어 세션을 종료하려고 합니다. 작업 중이라면 세션을 연장하세요.</p>
            <p class="idle-copy"><strong>로그아웃하면 저장하지 않은 변경이 사라집니다.</strong></p>
            <div class="banner banner--danger banner--top" role="alert" x-show="extendError" x-cloak>
              <span class="banner__icon"><th:block th:replace="~{admin/fragments/icons :: alert(18)}"></th:block></span>
              <div class="banner__body">
                <div class="banner__title" x-text="extendError && extendError.title"></div>
                <div x-text="extendError && extendError.detail"></div>
              </div>
            </div>
            <span class="sr-only" aria-live="polite" x-text="announcement"></span>
          </div>
        </div>
        <div class="dialog__foot">
          <button type="button" class="btn" x-on:click="logoutNow()">로그아웃</button>
          <button type="button" class="btn btn--primary" autofocus x-ref="extend" x-on:click="extend()" x-bind:disabled="extending">세션 연장</button>
        </div>
      </div>
    </div>
  </template>
</div>
</body>
</html>
