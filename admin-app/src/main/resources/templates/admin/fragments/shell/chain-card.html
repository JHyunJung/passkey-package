<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  사이드바 감사 체인 카드의 서버 응답(← Sidebar.tsx 의 chain-card, 30초 폴링).
  card : 모델 overview(AuditChainOverview), ago("방금"·"N분 전"·"N시간 전" — Sidebar.tsx 의 timeAgo). 위변조가 있으면 빨간 카드 + 안내, 없으면 AUDIT CHAIN OK + 마지막 검증·행 수.
         응답에 숨은 `[data-chain-tampered]`(data-tampered=위변조 수)를 넣어 chainCard 가 Alpine.store('chain') 에 반영한다(사이드바 "위변조 N" 배지).
  실패(비 2xx)는 이 조각을 쓰지 않는다 — 사이드바의 chainCard 컴포넌트가 "검증 상태 확인 불가 + 다시 시도"를 보인다.
-->
<th:block th:fragment="card">
  <th:block th:with="tampered=${overview.totals.tenantsTampered}, rows=${#numbers.formatInteger(overview.totals.verifiedRows, 1, 'COMMA')}">
    <a class="chain-card" th:classappend="${tampered > 0} ? 'chain-card--bad'" th:href="@{/admin/audit-chain}">
      <span class="chain-card__dot"></span>
      <span class="stack-1" style="gap: 2px">
        <th:block th:if="${tampered > 0}">
          <span class="chain-card__title" th:text="|위변조 의심 · ${tampered} tenant|">위변조 의심 · 1 tenant</span>
          <span class="chain-card__sub">즉시 확인이 필요합니다</span>
        </th:block>
        <th:block th:if="${tampered <= 0}">
          <span class="chain-card__title">AUDIT CHAIN OK</span>
          <span class="chain-card__sub" th:text="|마지막 검증 · ${ago} · ${rows} 행|">마지막 검증 · 방금 · 1,234 행</span>
        </th:block>
      </span>
    </a>
    <span hidden data-chain-tampered th:attr="data-tampered=${tampered}"></span>
  </th:block>
</th:block>
</body>
</html>
