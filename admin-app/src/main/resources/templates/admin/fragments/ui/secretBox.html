<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  SecretBox (← ui/SecretBox.tsx) — Alpine.data('copyBtn')
  th:replace="~{admin/fragments/ui/secretBox :: secretBox(value, copyLabel)}"
    value 한 번만 보여 주는 비밀값, copyLabel 버튼 이름(null 이면 '클립보드')
  복사하면 버튼이 '복사됨'(눌러도 되돌아가지 않는다: 원본과 같다). 복사 후 `copied` 이벤트가 올라간다.
-->
<div th:fragment="secretBox(value, copyLabel)" class="secret" ui:xdata="${@fmt.xdata('copyBtn', 'value', value, 'reset', 2147483647)}">
  <span class="secret__value" th:text="${value}">secret</span>
  <button type="button" class="btn btn--sm btn--primary" x-on:click="copy($event)">
    <span x-show="!copied" th:text="${copyLabel ?: '클립보드'}">클립보드</span>
    <span x-show="copied" x-cloak>복사됨</span>
  </button>
</div>
</body>
</html>
