<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Pagination (← ui/Pagination.tsx) — 링크 기반
  th:replace="~{admin/fragments/ui/pagination :: pagination(page, pageSize, total, baseUrl, pageSizeOptions, unit)}"
    page 현재 페이지(1부터, 범위를 넘으면 마지막으로 보정), pageSize, total 전체 건수
    baseUrl  page·size 를 뺀 경로+쿼리(예: '/admin/activity?type=AUTH'). 이동은 baseUrl 에 page=N&size=S 를 붙인 링크.
    pageSizeOptions  [50, 100, 200] 또는 null(선택 상자 없음), unit 단위(null 이면 '건')
  '1–50 / 120건', 0건이면 '0건'. 처음/마지막 페이지에서 이전/다음 버튼은 disabled. aria-label '이전 페이지'/'다음 페이지'.
-->
<div th:fragment="pagination(page, pageSize, total, baseUrl, pageSizeOptions, unit)" class="pager"
     th:with="pg=${@fmt.pager(page, pageSize, total)}, u=${unit ?: '건'}, sizeBase=${@fmt.pageSizeBase(baseUrl)}, prevUrl=${@fmt.pageUrl(baseUrl, pg.page - 1, pageSize)}, nextUrl=${@fmt.pageUrl(baseUrl, pg.page + 1, pageSize)}">
  <span th:text="${total == 0} ? ${'0' + u} : ${pg.from + '–' + pg.to + ' / ' + total + u}">1–50 / 120건</span>
  <div class="spacer"></div>
  <label class="row pager__size" th:if="${pageSizeOptions != null}">페이지당
    <select class="input" th:data-base="${sizeBase}" x-data x-on:change="window.location.assign($el.dataset.base + $event.target.value)">
      <option th:each="n : ${pageSizeOptions}" th:value="${n}" th:selected="${n == pageSize}" th:text="${n}">50</option>
    </select>
  </label>
  <a th:if="${pg.page > 1}" class="btn btn--sm" aria-label="이전 페이지" th:href="${prevUrl}"><th:block th:replace="~{admin/fragments/icons :: chevronLeft(14)}"/></a>
  <button th:unless="${pg.page > 1}" type="button" class="btn btn--sm" aria-label="이전 페이지" disabled><th:block th:replace="~{admin/fragments/icons :: chevronLeft(14)}"/></button>
  <span th:text="${pg.page + ' / ' + pg.last}">1 / 3</span>
  <a th:if="${pg.page < pg.last}" class="btn btn--sm" aria-label="다음 페이지" th:href="${nextUrl}"><th:block th:replace="~{admin/fragments/icons :: chevronRight(14)}"/></a>
  <button th:unless="${pg.page < pg.last}" type="button" class="btn btn--sm" aria-label="다음 페이지" disabled><th:block th:replace="~{admin/fragments/icons :: chevronRight(14)}"/></button>
</div>
</body>
</html>
