<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  통계 카드 공용 조각 — 테넌트 인증 현황 탭(tenant/funnel)과 플랫폼 현황(insights/page)이 같은 모양·같은 data-* 표식으로 쓴다.
  seriesCard(c: FunnelTabController.SeriesCard, columns)  일별 시도·성공 막대 + 날짜 말풍선 + 표로 보기 + CSV
  monthCard(months: MonthView 목록, columns, csv, sub)     월간 사용량 표 + CSV
  devicesCard(devices: DeviceView 목록, csv, sub)          인증기 분포 막대 + CSV
  모두 부모의 Alpine 상태 pending(기간 전환 중)을 읽어 CSV 링크를 막는다. 사용자 값은 th:text/th:title 로만 쓴다.
-->
<section th:fragment="seriesCard(c, columns)" class="card" x-data="{ asTable: false }" th:attr="data-series=${c.key}">
  <th:block th:replace="~{admin/fragments/ui/card :: cardHeader(${c.title}, null, null, ~{admin/fragments/ui/stats :: seriesLegend})}"></th:block>
  <div class="card__body stack-3">
    <div x-show="!asTable">
      <div role="img" class="fn-series" th:classappend="${c.dense} ? 'fn-series--dense'" th:attr="aria-label=${c.aria}">
        <div th:each="d : ${c.days}" class="fn-day">
          <div class="fn-tip" aria-hidden="true"><strong th:text="${d.dateText}">10월 1일</strong><span th:text="${d.tipText}">시도 10 · 성공 9 · 90.0%</span></div>
          <span class="fn-att" th:style="|height: ${d.attemptsPct}%|"></span>
          <span th:class="${c.key == 'reg'} ? 'fn-ok-reg' : 'fn-ok-auth'" th:style="|height: ${d.successPct}%|"></span>
        </div>
      </div>
      <div class="row hint" style="justify-content: space-between; padding: 0 4px; margin: 0">
        <span th:each="l : ${c.axis}" th:text="${l}">10-01</span>
      </div>
    </div>
    <div x-show="asTable" x-cloak>
      <th:block th:with="days=${c.days}"><th:block th:replace="~{admin/fragments/ui/dataTable :: dataTable(${columns}, ~{admin/fragments/ui/stats :: seriesBody})}"></th:block></th:block>
    </div>
    <div class="row" style="gap: 8px">
      <button type="button" class="btn btn--ghost btn--sm" aria-pressed="false" x-bind:aria-pressed="asTable" x-on:click="asTable = !asTable">표로 보기</button>
      <a class="btn btn--ghost btn--sm" th:href="${c.csv}" hx-boost="false" download data-csv-download x-bind:aria-disabled="pending" x-on:click="if (pending) $event.preventDefault()">CSV</a>
    </div>
  </div>
</section>

<section th:fragment="monthCard(months, columns, csv, sub)" class="card" data-monthly>
  <th:block th:replace="~{admin/fragments/ui/card :: cardHeader('월간 사용량', ${sub}, null, null)}"></th:block>
  <div class="card__body stack-3">
    <th:block th:replace="~{admin/fragments/ui/dataTable :: dataTable(${columns}, ~{admin/fragments/ui/stats :: monthBody})}"></th:block>
    <div class="row" style="gap: 8px">
      <a class="btn btn--ghost btn--sm" th:href="${csv}" hx-boost="false" download data-csv-download x-bind:aria-disabled="pending" x-on:click="if (pending) $event.preventDefault()">CSV</a>
    </div>
  </div>
</section>

<section th:fragment="devicesCard(devices, csv, sub)" class="card" data-devices>
  <th:block th:replace="~{admin/fragments/ui/card :: cardHeader('사용자 기기 분포', ${sub}, null, null)}"></th:block>
  <div class="card__body stack-3">
    <p th:if="${#lists.isEmpty(devices)}" class="hint" style="margin: 0">등록된 패스키가 없습니다.</p>
    <div th:unless="${#lists.isEmpty(devices)}" class="stack-3">
      <div th:each="d : ${devices}" class="dv-row">
        <span class="dv-row__name truncate" th:text="${d.name}" th:title="${d.name}">iCloud 키체인</span>
        <span class="dv-row__track"><span class="dv-row__bar" th:style="|width: ${d.widthPct}%|"></span></span>
        <span class="dv-row__num"><strong th:text="${d.shareText}">40.0%</strong> <span class="hint" style="margin: 0" th:text="${d.countText}">8개</span></span>
        <span class="dv-row__sub hint" th:text="${d.authText}">기간 인증 30건</span>
      </div>
    </div>
    <div class="row" style="gap: 8px" th:unless="${#lists.isEmpty(devices)}">
      <a class="btn btn--ghost btn--sm" th:href="${csv}" hx-boost="false" download data-csv-download x-bind:aria-disabled="pending" x-on:click="if (pending) $event.preventDefault()">CSV</a>
    </div>
  </div>
</section>

<span th:fragment="seriesLegend" class="row hint" style="gap: 10px; margin: 0" x-show="!asTable">
  <span class="row" style="gap: 4px"><span aria-hidden="true" class="fn-legend-dot fn-att"></span>시도</span>
  <span class="row" style="gap: 4px"><span aria-hidden="true" class="fn-legend-dot" th:classappend="${c.key == 'reg'} ? 'fn-ok-reg' : 'fn-ok-auth'"></span>성공</span>
</span>

<th:block th:fragment="seriesBody">
  <tr th:each="d : ${days}">
    <td><span class="mono" th:text="${d.day}">10-01</span></td>
    <td class="num" th:text="${d.attemptsText}">10</td>
    <td class="num" th:text="${d.successText}">9</td>
    <td class="num" th:text="${d.rateText}">90.0%</td>
  </tr>
</th:block>

<th:block th:fragment="monthBody">
  <tr th:each="m : ${months}">
    <td th:text="${m.label}">2026년 11월 (진행 중)</td>
    <td class="num" th:text="${m.authText}">1,200</td>
    <td class="num" th:text="${m.mauText}">300명</td>
    <td class="num" th:text="${m.newText}">40</td>
  </tr>
</th:block>
</body>
</html>
