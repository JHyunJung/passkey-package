<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  StatusStrip (← ui/StatusStrip.tsx)
  th:replace="~{admin/fragments/ui/statusStrip :: statusStrip(results, label, fluid)}"
    results List<Boolean>: true 정상, false 실패(strip__bar--bad), null 기록 없음(strip__bar--none)
    label   요약(role=img 의 aria-label), fluid true 면 strip--fluid
-->
<div th:fragment="statusStrip(results, label, fluid)" class="strip" th:classappend="${fluid == true} ? 'strip--fluid'" role="img" th:aria-label="${label}">
  <th:block th:each="r : ${results}">
    <span th:if="${r == null}" class="strip__bar strip__bar--none"></span>
    <span th:if="${r != null and r == false}" class="strip__bar strip__bar--bad"></span>
    <span th:if="${r != null and r != false}" class="strip__bar"></span>
  </th:block>
</div>
</body>
</html>
