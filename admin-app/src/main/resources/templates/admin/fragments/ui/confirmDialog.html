<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  ConfirmDialog (← ui/ConfirmDialog.tsx) — Alpine.data('dialog') 의 L1/L2/L3 확인 절차
  th:replace="~{admin/fragments/ui/confirmDialog :: confirmDialog(id, level, title, verb, sub, body, danger, expected, typeLabel, acknowledge, confirmAttrs)}"
    id           필수. 열기: $dispatch('dialog:open', {id})
    level        'L1' | 'L2' | 'L3' (L3 만 확인 절차가 있다)
    title, verb  문자열(verb 는 확인 버튼 이름, 진행 중에는 '<verb> 중…')
    sub          문자열 또는 null, body 조각 또는 null
    danger       true | null(기본 true → danger-solid) | false(primary)
    expected, typeLabel   L3 에서 이름을 입력해야 하면 정확한 값과 라벨(둘 다 null 이면 입력 없음)
    acknowledge  L3 에서 체크해야 하는 문구 또는 null (expected 가 있으면 무시)
    confirmAttrs 확인 버튼 속성 Map(hx-post, hx-vals, hx-target 등). 서버가 오류를 보내면 토스트로 나가고, 성공 응답이면 닫힌다.
  기본 포커스는 취소 버튼(role=alertdialog, 스크림 클릭으로 닫히지 않음). 오류를 안에서 보여 줄 자리는 #<id>-error (role=alert).
-->
<div th:fragment="confirmDialog(id, level, title, verb, sub, body, danger, expected, typeLabel, acknowledge, confirmAttrs)"
     ui:xdata="${@fmt.xdata('dialog', 'id', id, 'level', level, 'closeOnScrim', false, 'typing', expected != null, 'ack', expected == null and acknowledge != null)}"
     x-on:dialog:open.window="onOpen($event)" x-on:dialog:close.window="onClose($event)" x-on:keydown.escape.window="onEscape()">
  <template x-if="open">
    <div class="scrim">
      <div class="dialog" role="alertdialog" aria-modal="true" th:aria-labelledby="${id + '-title'}"
           x-trap.noscroll="open" x-on:match-change="typed = $event.detail"
           x-on:htmx:before-request="busy = true" x-on:htmx:after-request="busy = false; if ($event.detail.successful) open = false">
        <div class="dialog__head">
          <h3 class="dialog__title" th:id="${id + '-title'}" th:text="${title}">제목</h3>
          <div class="dialog__sub" th:if="${sub}" th:text="${sub}">설명</div>
        </div>
        <div class="dialog__body">
          <div th:id="${id + '-error'}" role="alert"></div>
          <th:block th:if="${body}"><th:block th:replace="${body}"/></th:block>
          <th:block th:if="${level == 'L3' and expected != null}">
            <th:block th:replace="~{admin/fragments/ui/confirmByTyping :: confirmByTyping(${id + '-confirm'}, ${expected}, ${typeLabel}, ${verb})}"/>
          </th:block>
          <label class="confirm__ack" th:if="${level == 'L3' and expected == null and acknowledge != null}">
            <input type="checkbox" x-model="acked"><th:block th:text="${acknowledge}">확인</th:block>
          </label>
        </div>
        <div class="dialog__foot">
          <button type="button" class="btn" autofocus x-on:click="close()" x-bind:disabled="busy">취소</button>
          <button type="button" class="btn" th:classappend="${danger == false} ? 'btn--primary' : 'btn--danger-solid'"
                  ui:attrs="${confirmAttrs}" x-bind:disabled="busy || !gateOk"><span x-show="!busy" th:text="${verb}">확인</span><span x-show="busy" x-cloak th:text="${verb + ' 중…'}">확인 중…</span></button>
        </div>
      </div>
    </div>
  </template>
</div>
</body>
</html>
