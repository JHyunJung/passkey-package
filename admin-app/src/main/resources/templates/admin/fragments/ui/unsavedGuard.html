<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  useUnsavedGuard (← ui/useUnsavedGuard.tsx) — Alpine.data('unsavedGuard')
  th:replace="~{admin/fragments/ui/unsavedGuard :: unsavedGuard(title, body)}"     (레이아웃에 한 번)
    title 문자열(null 이면 '저장하지 않은 변경이 있습니다'), body 문자열(null 이면 '이동하면 변경 사항이 사라집니다.')
  saveBar 가 올리는 `unsaved-change`(detail.count) 이벤트로 dirty 를 알고, dirty 인 동안 같은 출처의 다른 주소로 가는
  링크 클릭을 가로채 '머무르기 / 이동' 확인(role=alertdialog, 기본 포커스는 머무르기)을 띄운다.
  새로고침·탭 닫기는 saveBar 의 beforeunload 가 막는다.
-->
<div th:fragment="unsavedGuard(title, body)" x-data="unsavedGuard"
     x-on:unsaved-change.window="onChange($event)" x-on:click.capture.window="onClick($event)" x-on:keydown.escape.window="if (open) stay()">
  <template x-if="open">
    <div class="scrim" x-on:mousedown.self="stay()">
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="unsaved-guard-title" x-trap.noscroll="open">
        <div class="dialog__head">
          <h3 class="dialog__title" id="unsaved-guard-title" th:text="${title ?: '저장하지 않은 변경이 있습니다'}">저장하지 않은 변경이 있습니다</h3>
        </div>
        <div class="dialog__body"><p class="dialog__text" th:text="${body ?: '이동하면 변경 사항이 사라집니다.'}">이동하면 변경 사항이 사라집니다.</p></div>
        <div class="dialog__foot">
          <button type="button" class="btn" autofocus x-on:click="stay()">머무르기</button>
          <button type="button" class="btn btn--danger-solid" x-on:click="leave()">이동</button>
        </div>
      </div>
    </div>
  </template>
</div>
</body>
</html>
