<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  PageHeader (← ui/PageHeader.tsx)
  th:replace="~{admin/fragments/ui/pageHeader :: pageHeader(title, sub, actions)}"
    title 문자열, sub 문자열 또는 null, actions 조각 또는 null(오른쪽 버튼 묶음)
-->
<div th:fragment="pageHeader(title, sub, actions)" class="page__head">
  <div class="page__head-main">
    <h1 class="page__title" th:text="${title}">제목</h1>
    <p class="page__sub" th:if="${sub}" th:text="${sub}">설명</p>
  </div>
  <th:block th:if="${actions}"><div class="spacer"></div><div class="row"><th:block th:replace="${actions}"/></div></th:block>
</div>
</body>
</html>
