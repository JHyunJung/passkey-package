<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  CopyBtn (← ui/CopyBtn.tsx) — Alpine.data('copyBtn')
  th:replace="~{admin/fragments/ui/copyBtn :: copyBtn(value, label, iconOnly)}"
    value 복사할 문자열, label 버튼 이름(null 이면 '복사'), iconOnly true 면 아이콘 버튼(label 은 aria-label·title)
  복사하면 1.5초간 체크 아이콘/'복사됨'. 클릭은 상위 행 클릭으로 전파되지 않는다.
  value 가 비밀값이면 이 조각 대신 secretBox 를 쓴다(속성에 값이 들어간다는 점은 같다).
-->
<th:block th:fragment="copyBtn(value, label, iconOnly)">
  <button th:if="${iconOnly == true}" type="button" class="icon-btn icon-btn--sm"
          th:aria-label="${label ?: '복사'}" th:title="${label ?: '복사'}"
          ui:xdata="${@fmt.xdata('copyBtn', 'value', value)}" x-on:click="copy($event)">
    <span x-show="!copied"><th:block th:replace="~{admin/fragments/icons :: copy(13)}"/></span>
    <span x-show="copied" x-cloak><th:block th:replace="~{admin/fragments/icons :: check(13)}"/></span>
  </button>
  <button th:unless="${iconOnly == true}" type="button" class="btn btn--sm"
          ui:xdata="${@fmt.xdata('copyBtn', 'value', value, 'label', label ?: '복사')}" x-on:click="copy($event)">
    <span x-show="!copied"><th:block th:replace="~{admin/fragments/icons :: copy(13)}"/></span>
    <span x-show="copied" x-cloak><th:block th:replace="~{admin/fragments/icons :: check(13)}"/></span>
    <span x-text="copied ? '복사됨' : label" th:text="${label ?: '복사'}">복사</span>
  </button>
</th:block>
</body>
</html>
