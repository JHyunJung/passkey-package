spring:
  config:
    import: classpath:application-common.yml
  application.name: admin-app-it
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
  session:
    timeout: PT30M
    # Boot 4: spring.session.redis.* → spring.session.data.redis.* (옛 키는 무시된다).
    data:
      redis:
        namespace: spring:session

passkey:
  key-envelope:
    # NON-SECRET, dev only — 공개 상수이지만 '0키' 신호를 제거해 실수로
    # prod 에서 약한 키가 쓰이는 것을 식별하기 쉽게 한다. prod 는 환경변수로 주입.
    # Matches the dev profile default; production uses PASSKEY_KEY_ENVELOPE_MASTER_KEY.
    master-key: "jDKp21WXeDAwinZI91Hf+8L2zv4xlIQI15YPLhttyYM="
  # Disable @Scheduled auto-fire during short ITs. AdminFlowIT and any
  # test that boots the full admin context should not have MdsSyncJob
  # or KeyExpirationJob racing against the test's own state setup.
  # Tests that need scheduler behavior invoke MdsSchedulerService.runOnce()
  # or KeyExpirationJob.runOnce() directly (see MdsSchedulerIT, KeyRotationIT).
  mds:
    initial-delay: PT99H
    fixed-delay: PT99H
  key-rotation:
    grace: PT30M
    expiration-job:
      initial-delay: PT99H
      fixed-delay: PT99H
