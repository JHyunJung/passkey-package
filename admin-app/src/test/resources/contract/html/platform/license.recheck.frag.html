@status: 200
@contentType: text/html;charset=UTF-8

<div class="stack-5" id="license-body" style="max-width: 820px">
  <div id="license-recheck-alert"></div>

  <!-- 상태 헤드라인 — 원시 enum 대신 배지(원문은 툴팁) -->
  <section class="card">
    <div class="row" style="gap: 20px; padding: 20px 24px">
      <div class="col" style="gap: 6px; flex: 1 1 240px; min-width: 0">
        <span class="t-over">상태</span>
        <span class="row" style="gap: 10px">
          
          <span class="muted">알 수 없음</span>
        </span>
        
      </div>
      <div class="col" style="gap: 6px; flex: 1 1 240px; min-width: 0">
        <div class="row">
          <span class="hint hint--flush">만료까지</span>
          <div class="spacer"></div>
          <strong style="font-size: 13px"></strong>
        </div>
        
      </div>
      <button class="btn" hx-disabled-elt="this" hx-get="/admin/_/license/recheck" hx-swap="outerHTML" hx-sync="this:drop" hx-target="#license-body" type="button">
        <span class="license-recheck__idle">지금 다시 확인</span><span class="license-recheck__busy">확인 중…</span>
      </button>
    </div>
  </section>

  

  <section class="card">
    <div class="card__head">
  <div class="card__head-main">
    
    <h2 class="card__title">상세</h2>
    
  </div>
  
</div>
    <dl class="kv kv--rows">
      
    </dl>
  </section>
</div>
