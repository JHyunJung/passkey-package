@status: 200
@contentType: text/html;charset=UTF-8


  <tbody hx-swap-oob="beforeend:#audit-rows">
  
    
  
    <tr class="is-clickable" data-day="2026-10-11" data-ev data-fail="0"
        data-g="other" data-id="00000000-0000-0000-0000-00000000f111"
        tabindex="0" x-bind:aria-expanded="exp === $el.dataset.id" x-bind:class="{ 'is-expanded': exp === $el.dataset.id }" x-on:click="exp = exp === $el.dataset.id ? null : $el.dataset.id" x-on:keydown.self.enter.prevent="$el.click()" x-on:keydown.self.space.prevent="$el.click()">
      <td>
        <div class="stack-1" style="gap: 0">
          <span style="font-size: 13px">12:34:56</span>
          <span class="hint" style="margin: 0">2일 전</span>
        </div>
      </td>
      <td><span class="badge  mono">x</span></td>
      <td>
        <span class="row" style="gap: 6px; flex-wrap: nowrap">
          <span class="tag">ADMIN</span>
          <span class="mono hint" style="margin: 0">…x</span>
        </span>
      </td>
      <td>
        <span class="row" style="gap: 6px; flex-wrap: nowrap">
          <span class="tag">x</span>
          <span class="mono hint" style="margin: 0">…x</span>
        </span>
      </td>
      <td><span class="mono hint truncate" style="display: inline-block; max-width: 280px; margin: 0; vertical-align: middle">{&quot;raw&quot;:&quot;x&quot;}</span></td>
      <td>
        <span style="color: var(--mute); display: inline-flex">
          <span x-show="exp !== $el.closest('tr').dataset.id"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="14"><path d="M6 9l6 6 6-6"/></svg></span>
          <span x-cloak x-show="exp === $el.closest('tr').dataset.id"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="14"><path d="M6 15l6-6 6 6"/></svg></span>
        </span>
      </td>
    </tr>
    <tr class="table__expanded" data-id="00000000-0000-0000-0000-00000000f111" x-cloak x-show="exp === $el.dataset.id">
      <td colspan="6">
        <div class="stack-3" style="padding-left: 140px">
          
          <div class="row" style="gap: 8px">
            <span class="t-over">payload</span>
            <div class="spacer"></div>
            
  
  <button class="btn btn--sm" type="button"
          x-data="copyBtn({&quot;value&quot;:&quot;{\n  \&quot;raw\&quot;: \&quot;x\&quot;\n}&quot;,&quot;label&quot;:&quot;JSON 복사&quot;})" x-on:click="copy($event)">
    <span x-show="!copied"><svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="13"><rect height="11" rx="2" width="11" x="9" y="9"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></span>
    <span x-cloak x-show="copied"><svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="13"><path d="M5 12l5 5L20 7"/></svg></span>
    <span x-text="copied ? '복사됨' : label">JSON 복사</span>
  </button>

            <button class="btn btn--sm" data-dlg="audit-evt-00000000-0000-0000-0000-00000000f111" type="button" x-on:click="$dispatch('dialog:open', { id: $el.dataset.dlg })">상세 다이얼로그</button>
          </div>
          <pre class="mono audit-pre">{
  &quot;raw&quot;: &quot;x&quot;
}</pre>
        </div>
        <!-- Audit Event 다이얼로그(V2: 언제 · 누가 · 대상 · payload). 열릴 때 안쪽을 그린다(x-if). -->
        <div x-data="dialog({&quot;id&quot;:&quot;audit-evt-00000000-0000-0000-0000-00000000f111&quot;})" x-on:dialog:close.window="onClose($event)" x-on:dialog:open.window="onOpen($event)" x-on:keydown.escape.window="onEscape()">
          <template x-if="open">
            <div class="scrim" x-on:mousedown="onScrim($event)">
              <div aria-labelledby="audit-evt-00000000-0000-0000-0000-00000000f111-title" aria-modal="true" class="dialog" role="dialog" x-trap.noscroll="open">
                <div class="dialog__head">
                  <h3 class="dialog__title" id="audit-evt-00000000-0000-0000-0000-00000000f111-title">
                    <span class="row" style="gap: 8px"><span>Audit Event</span><span class="badge  mono">x</span></span>
                  </h3>
                </div>
                <div class="dialog__body stack-4">
                  <div class="stack-1">
                    <span class="t-over">언제</span>
                    <span style="font-size: 13px">2026-10-11 12:34:56 KST</span>
                    <span class="mono hint" style="margin: 0">2026-10-11T03:34:56.000Z</span>
                  </div>
                  <div class="row" style="gap: 24px; align-items: flex-start">
                    <div class="stack-1">
                      <span class="t-over">누가 (actor)</span>
                      <span class="row" style="gap: 6px; font-size: 13px"><span class="tag">ADMIN</span><span class="mono hint" style="margin: 0">x</span></span>
                    </div>
                    <div class="stack-1">
                      <span class="t-over">대상 (subject)</span>
                      <span class="row" style="gap: 6px; font-size: 13px"><span class="tag">x</span><span class="mono hint" style="margin: 0">x</span></span>
                    </div>
                  </div>
                  <div class="stack-2">
                    <div class="row"><span class="t-over">payload</span><div class="spacer"></div>
                      
  
  <button class="btn btn--sm" type="button"
          x-data="copyBtn({&quot;value&quot;:&quot;{\n  \&quot;raw\&quot;: \&quot;x\&quot;\n}&quot;,&quot;label&quot;:&quot;JSON 복사&quot;})" x-on:click="copy($event)">
    <span x-show="!copied"><svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="13"><rect height="11" rx="2" width="11" x="9" y="9"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></span>
    <span x-cloak x-show="copied"><svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="13"><path d="M5 12l5 5L20 7"/></svg></span>
    <span x-text="copied ? '복사됨' : label">JSON 복사</span>
  </button>
</div>
                    <pre class="mono audit-pre audit-pre--dlg">{
  &quot;raw&quot;: &quot;x&quot;
}</pre>
                  </div>
                </div>
                <div class="dialog__foot"><button class="btn" type="button" x-on:click="close()">닫기</button></div>
              </div>
            </div>
          </template>
        </div>
      </td>
    </tr>
  
  
</tbody>
  <input hx-swap-oob="true" id="audit-page" name="page" type="hidden" value="3">
  <input hx-swap-oob="true" id="audit-last-day" name="lastDay" type="hidden" value="2026-10-11">
  <div hx-swap-oob="true" id="audit-more" style="display: contents">
  
</div>
