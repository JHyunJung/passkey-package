@status: 200
@contentType: text/html;charset=UTF-8


  <div x-data x-init="$nextTick(() => $dispatch('dialog:open', { id: 'cred-revoke' }))">
    <div x-data="dialog({&quot;id&quot;:&quot;cred-revoke&quot;,&quot;level&quot;:&quot;L3&quot;,&quot;verb&quot;:&quot;회수&quot;,&quot;closeOnScrim&quot;:false,&quot;typing&quot;:true,&quot;ack&quot;:false})" x-on:dialog:close.window="onClose($event)" x-on:dialog:open.window="onOpen($event)" x-on:keydown.escape.window="onEscape()">
  <template x-if="open">
    <div class="scrim">
      <div aria-labelledby="cred-revoke-title" aria-modal="true" class="dialog" role="alertdialog"
           x-on:htmx:after-request="onAfterRequest($event)" x-on:htmx:before-request="onBeforeRequest($event)"
           x-on:match-change="typed = $event.detail" x-trap.noscroll="open">
        <div class="dialog__head">
          <h3 class="dialog__title" id="cred-revoke-title">Credential을 회수할까요?</h3>
          <div class="dialog__sub">이 사용자는 해당 패스키로 더 이상 로그인할 수 없습니다. 되돌릴 수 없습니다.</div>
        </div>
        <div class="dialog__body">
          <!-- 실패 표시(ConfirmDialog.tsx 의 Alert tone=bad): 다이얼로그는 열어 둔 채 재시도할 수 있다 -->
          <div class="banner banner--danger banner--top" id="cred-revoke-error" role="alert" x-cloak x-show="error">
            <span class="banner__icon"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="18"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 18h.01"/></svg></span>
            <div class="banner__body">
              <div class="banner__title" x-text="error && error.title"></div>
              <div x-text="error && error.text"></div>
            </div>
          </div>
          
    <dl class="kv" style="grid-template-columns: 100px minmax(0, 1fr)">
      <dt>credentialId</dt><dd class="mono" style="font-size: 12px">…Y3JlZDE</dd>
      <dt>사용자</dt><dd class="mono" style="font-size: 12px">dXNlcjE</dd>
      <dt>인증기</dt><dd>YubiKey 5</dd>
    </dl>
  
          
            <div x-data="confirmByTyping({&quot;expected&quot;:&quot;Y3JlZDE&quot;,&quot;actionLabel&quot;:&quot;회수&quot;})">
  <label class="label" for="cred-revoke-confirm">확인을 위해 마지막 8자 Y3JlZDE 를 입력하세요</label>
  <input aria-describedby="cred-revoke-confirm-h" autocomplete="off" class="input mono" id="cred-revoke-confirm"
         x-bind:class="ok ? 'input--ok' : ''" x-model="v" x-on:input="onInput()">
  <p class="hint" id="cred-revoke-confirm-h" x-bind:class="ok ? 'hint--ok' : ''" x-text="hint">일치해야 회수 버튼이 활성화됩니다.</p>
</div>
          
          
        </div>
        <div class="dialog__foot">
          <button autofocus class="btn" type="button" x-bind:disabled="busy" x-on:click="close()">취소</button>
          <button class="btn btn--danger-solid" data-confirm data-quiet hx-delete="/admin/_/tenants/00000000-0000-0000-0000-00000000f111/credentials/Y3JlZDE?page=1&amp;size=50" hx-headers='{"X-Confirm": "1"}' hx-swap="outerHTML" hx-sync="this:drop" hx-target="#cred-results" type="button" x-bind:disabled="busy || !gateOk"><span x-show="!busy">회수</span><span x-cloak x-show="busy">회수 중…</span></button>
        </div>
      </div>
    </div>
  </template>
</div>
  </div>
