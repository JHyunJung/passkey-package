@status: 200
@contentType: text/html;charset=UTF-8


  <p class="field__error" data-field-error hx-swap-oob="true"
     id="wa-err-rpName"></p>
  <p class="field__error" data-field-error hx-swap-oob="true"
     id="wa-err-timeoutMs"></p>
  <p class="field__error" data-field-error hx-swap-oob="true"
     id="wa-err-origins"></p>
  <p class="field__error" data-field-error hx-swap-oob="true"
     id="wa-err-userVerification"></p>
  <p class="field__error" data-field-error hx-swap-oob="true"
     id="wa-err-attestationConveyance"></p>
  <p class="field__error" data-field-error hx-swap-oob="true"
     id="wa-err-form"></p>

  <form class="fieldset--bare" id="wa-confirm-form" novalidate x-data x-init="$nextTick(() => $dispatch('dialog:open', { id: 'wa-confirm' }))"
        x-on:submit.prevent>
    <input name="rpName" type="hidden" value="Alpha 2">
    <input name="timeoutMs" type="hidden" value="90000">
    <input name="origins" type="hidden" value="https://passkey.alpha.com"><input name="origins" type="hidden" value="https://login.alpha.com">
    <input name="userVerification" type="hidden" value="PREFERRED">
    <input name="attestationConveyance" type="hidden" value="DIRECT">
    <input name="changes" type="hidden" value="5">
    <div x-data="dialog({&quot;id&quot;:&quot;wa-confirm&quot;,&quot;level&quot;:&quot;L2&quot;,&quot;verb&quot;:&quot;저장&quot;,&quot;closeOnScrim&quot;:false,&quot;typing&quot;:false,&quot;ack&quot;:false})" x-on:dialog:close.window="onClose($event)" x-on:dialog:open.window="onOpen($event)" x-on:keydown.escape.window="onEscape()">
  <template x-if="open">
    <div class="scrim">
      <div aria-labelledby="wa-confirm-title" aria-modal="true" class="dialog" role="alertdialog"
           x-on:htmx:after-request="onAfterRequest($event)" x-on:htmx:before-request="onBeforeRequest($event)"
           x-on:match-change="typed = $event.detail" x-trap.noscroll="open">
        <div class="dialog__head">
          <h3 class="dialog__title" id="wa-confirm-title">변경 사항 5개를 저장할까요?</h3>
          <div class="dialog__sub">다음 패스키 등록·인증부터 적용됩니다.</div>
        </div>
        <div class="dialog__body">
          <!-- 실패 표시(ConfirmDialog.tsx 의 Alert tone=bad): 다이얼로그는 열어 둔 채 재시도할 수 있다 -->
          <div class="banner banner--danger banner--top" id="wa-confirm-error" role="alert" x-cloak x-show="error">
            <span class="banner__icon"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="18"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 18h.01"/></svg></span>
            <div class="banner__body">
              <div class="banner__title" x-text="error && error.title"></div>
              <div x-text="error && error.text"></div>
            </div>
          </div>
          
    <div class="diff">
      <div class="row diff__row">
        <span class="diff__key" title="rpName">RP 표시 이름</span>
        
          
          
        
        
      </div>
      <div class="row diff__row">
        <span class="diff__key" title="timeoutMs">대기 시간</span>
        
        
          <span class="tag tag--from" title="60000">60초</span>
          <span aria-hidden="true" class="diff__arrow"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="14"><path d="M9 6l6 6-6 6"/></svg></span>
          <span class="tag tag--to" title="90000">90초</span>
        
      </div>
      <div class="row diff__row">
        <span class="diff__key" title="origins">허용 origin</span>
        
          
          <span class="tag mono tag--to" title="https://login.alpha.com">+ https://login.alpha.com</span>
        
        
      </div>
      <div class="row diff__row">
        <span class="diff__key" title="requireUserVerification">사용자 검증</span>
        
          
          
        
        
      </div>
      <div class="row diff__row">
        <span class="diff__key" title="attestationConveyance">인증기 증명</span>
        
        
          <span class="tag tag--from" title="NONE">요청 안 함</span>
          <span aria-hidden="true" class="diff__arrow"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="14"><path d="M9 6l6 6-6 6"/></svg></span>
          <span class="tag tag--to" title="DIRECT">직접</span>
        
      </div>
    </div>
    <div class="banner banner--info"
     role="status">
  <span class="banner__icon">
    
    
      
      
      <svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="18"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 8h.01"/></svg>
      
    
  </span>
  <div class="banner__body">
    
    <div>저장하면 감사 로그에 “WebAuthn 설정 변경”이 기록됩니다.</div>
  </div>
  
</div>
  
          
          
        </div>
        <div class="dialog__foot">
          <button autofocus class="btn" type="button" x-bind:disabled="busy" x-on:click="close()">취소</button>
          <button class="btn btn--primary" data-confirm data-quiet hx-headers='{"X-Confirm": "1"}' hx-put="/admin/_/tenants/00000000-0000-0000-0000-00000000f111/webauthn" hx-swap="innerHTML" hx-sync="#tenant-tab:replace" hx-target="#tenant-tab" type="button" x-bind:disabled="busy || !gateOk"><span x-show="!busy">저장</span><span x-cloak x-show="busy">저장 중…</span></button>
        </div>
      </div>
    </div>
  </template>
</div>
  </form>
