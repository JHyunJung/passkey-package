@status: 200
@contentType: text/html;charset=UTF-8


  <div id="cred-results">
  <!-- 다음 요청(검색 입력·필터·페이지 크기)이 이어 받는 현재 상태 -->
  <input id="cred-status" name="status" type="hidden" value="REVOKED">
  <input id="cred-size" name="size" type="hidden" value="50">
  <!-- 필터·칩 요청만 싣는다(원본: 필터는 현재 페이지 안에서 거른다). 검색·페이지 크기는 1페이지로 -->
  <input id="cred-page" name="page" type="hidden" value="1">

  
  
    <div class="tw">
  <table class="table">
    <thead>
      <tr>
        <th>
          
          Credential ID
        </th>
        <th>
          
          사용자
        </th>
        <th>
          
          별칭
        </th>
        <th>
          
          인증기
        </th>
        <th>
          
          전송 방식
        </th>
        <th class="num">
          
          서명 카운터
        </th>
        <th>
          
          상태
        </th>
        <th>
          
          마지막 사용
        </th>
        <th style="width: 48px">
          <span class="sr-only">회수</span>
          
        </th>
      </tr>
    </thead>
    <tbody>
  
  
  <tr class="table__empty"><td colspan="9">
  <div class="empty">
  <img alt="" class="empty__art" src="/admin/img/no-results.webp">
  <p class="empty__title">검색 결과가 없습니다.</p>
  <p class="empty__sub">검색어나 필터를 바꿔 보세요.</p>
  <button class="btn btn--sm" hx-get="/admin/_/tenants/00000000-0000-0000-0000-00000000f111/tab/credentials/list?reset=all" hx-include="#cred-size" hx-swap="outerHTML" hx-target="#cred-results" type="button">필터 지우기</button>
</div>
</td></tr>
</tbody>
  </table>
</div>
    <div class="pager">
      <span>1–2 / 2건</span>
      <div class="spacer"></div>
      <label class="row pager__size">페이지당
        <select class="input" hx-get="/admin/_/tenants/00000000-0000-0000-0000-00000000f111/tab/credentials/list" hx-include="#cred-q, #cred-aaguid, #cred-status"
                hx-swap="outerHTML" hx-target="#cred-results" hx-trigger="change" name="size">
          <option selected="selected" value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </label>
      
      <button aria-label="이전 페이지" class="btn btn--sm" disabled type="button"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="14"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span>1 / 1</span>
      
      <button aria-label="다음 페이지" class="btn btn--sm" disabled type="button"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="14"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  
</div>
  <div hx-swap-oob="true" id="cred-controls" style="display: contents">
  <button aria-pressed="false" class="fchip" type="button" x-bind:aria-pressed="filtersOpen"
          x-bind:class="{ 'fchip--on': filtersOpen }" x-on:click="filtersOpen = !filtersOpen">
    <svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="13"><path d="M12 5v14M5 12h14"/></svg>필터 · aaguid · 상태</button>
  
  
    <span class="chip" title="REVOKED">
      <span class="truncate">상태: 회수됨</span>
      <button aria-label="상태 필터 제거" class="chip__x" hx-get="/admin/_/tenants/00000000-0000-0000-0000-00000000f111/tab/credentials/list?status=ALL&amp;reset=status" hx-include="#cred-q, #cred-aaguid, #cred-page, #cred-size" hx-swap="outerHTML" hx-target="#cred-results" type="button"><svg aria-hidden="true" fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="12"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </span>
  
  <div class="spacer"></div>
  <span class="hint" style="margin: 0">이 페이지 2건 중 0건</span>
  
  <button class="btn" disabled type="button">
    <svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="14"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>CSV 내보내기 (현재 페이지 0건)</button>
</div>
