@status: 422
@contentType: text/html;charset=UTF-8

<div class="auth-card" id="auth-card">
      <div class="col" style="gap: 6px;">
        <h1 class="page__title">비밀번호 재설정</h1>
        
        <p class="card__sub">가입한 이메일을 입력하면 재설정 링크를 보내드립니다. 링크는 일정 시간 후 만료됩니다.</p>
      </div>
      
      <form action="/admin/forgot-password" class="col" hx-post="/admin/forgot-password" hx-swap="outerHTML" hx-sync="this:drop"
            hx-target="#auth-card" method="post" novalidate style="gap: 20px;"
            x-data="forgotForm"
            x-on:htmx:after-request="onAfter($event)" x-on:htmx:before-request="onBefore($event)"
            x-on:htmx:send-error="onNetworkError()" x-on:htmx:timeout="onNetworkError()">
        <input name="_csrf" type="hidden" value="{{CSRF}}">
        <template x-if="rejected">
          <div class="banner banner--danger banner--top" role="alert">
            <span class="banner__icon"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="18"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 18h.01"/></svg></span>
            <div class="banner__body">
              <div class="banner__title">요청이 거부되었습니다.</div>
              <div>보안 토큰이 만료되었을 수 있습니다. 페이지를 새로 고친 뒤 다시 시도하세요. <span class="mono" style="display: block; font-size: 11px;" x-text="'HTTP ' + status"></span></div>
            </div>
            <div class="banner__actions"><button class="btn btn--sm" type="button" x-on:click="window.location.reload()">새로 고침</button></div>
          </div>
        </template>
        <template x-if="failure">
          <div class="banner banner--danger banner--top" role="alert">
            <span class="banner__icon"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="18"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 18h.01"/></svg></span>
            <div class="banner__body">
              <div class="banner__title">요청을 보내지 못했습니다.</div>
              <div>네트워크 또는 서버 문제입니다. 메일은 발송되지 않았습니다. 잠시 후 다시 시도하세요.<span class="mono" style="display: block; font-size: 11px;" x-show="status !== null" x-text="'HTTP ' + status"></span></div>
            </div>
          </div>
        </template>
        <div>
          <label class="label" for="forgot-email">이메일</label>
          <input aria-describedby="forgot-email-error" aria-invalid="true" autocomplete="username" autofocus class="input input--lg" id="forgot-email" name="email"
                 placeholder="you@crosscert.com" type="email" x-bind:readonly="submitting" x-model="email">
          <p class="field__error" id="forgot-email-error">이메일을 입력하세요.</p>
          <p class="hint" x-cloak x-show="failure">입력한 이메일은 그대로 있습니다.</p>
        </div>
        <button class="btn btn--primary btn--lg" type="submit" x-bind:disabled="!canSubmit()" x-ref="submit"
                x-text="submitting ? '전송 중…' : (failure ? '다시 시도' : '재설정 링크 보내기')">재설정 링크 보내기</button>
      </form>
    </div>
