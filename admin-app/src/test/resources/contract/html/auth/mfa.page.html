@status: 200
@contentType: text/html;charset=UTF-8

<!DOCTYPE html>
<html lang="ko">
<!--
  MFA 단계(← pages/MfaChallenge.tsx). 비밀번호 인증을 마친 MFA 대기 세션이 GET /admin/login 에서 받는다.
  제출: hx-post /admin/login/mfa(code, mode, _csrf) → LoginPageController.verifyMfa → MfaController.verify(Java 호출).
    성공 → HX-Redirect /admin(복구 코드를 썼으면 남은 개수 경고 토스트를 HX-Trigger 로 함께; ui.js 가 다음 화면까지 넘긴다)
    코드 틀림(401) → 아래 error 조각 + 422 → #mfa-error 에 스왑
    잠금으로 세션이 무효화됨 → HX-Redirect /admin/login
    5xx·네트워크 오류 → auth.js 가 "확인하지 못했습니다" 경고(코드가 틀렸다고 말하지 않는다)
  TOTP / 복구 코드 모드 전환은 같은 카드 안(Alpine x-if — 지금 모드의 code 입력 하나만 제출된다).
-->
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Crosscert Passkey Admin</title>
  <link href="/admin/img/favicon.png" rel="icon">
  <link href="/admin/css/fonts.css" rel="stylesheet">
  <link href="/admin/css/tokens.css" rel="stylesheet">
  <link href="/admin/css/globals.css" rel="stylesheet">
  <link href="/admin/css/components.css" rel="stylesheet">
  <script src="/admin/js/vendor/htmx.min.js"></script>
  <script src="/admin/js/ui.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script defer src="/admin/js/vendor/alpine.min.js"></script>
</head>
<body>
<main class="auth" x-data="mfaChallenge">
  <div class="auth__col">
    <img alt="CROSSCERT" class="auth__logo" src="/admin/img/crosscert-logo-transparent.png">
    <form class="auth-card" hx-post="/admin/login/mfa" hx-swap="innerHTML" hx-sync="this:drop" hx-target="#mfa-error" id="mfa-form"
          x-on:htmx:after-request="onAfter($event)" x-on:htmx:before-request="onBefore($event)"
          x-on:htmx:send-error="onNetworkError(false)" x-on:htmx:timeout="onNetworkError(true)">
      <input name="_csrf" type="hidden" value="{{CSRF}}">
      <input name="mode" type="hidden" value="totp" x-bind:value="mode">

      <template x-if="mode === 'totp'">
        <div class="col" style="gap: 6px; align-items: center; text-align: center;">
          <img alt="" src="/admin/img/mfa.webp" style="width: 88px; height: 88px; object-fit: contain;">
          <h1 class="page__title">2단계 인증</h1>
          <p class="card__sub">authenticator 앱에 표시된 6자리 코드를 입력하세요.</p>
        </div>
      </template>
      <template x-if="mode === 'recovery'">
        <div class="col" style="gap: 6px;">
          <h1 class="page__title">복구 코드로 로그인</h1>
          <p class="card__sub">MFA 등록 때 저장한 복구 코드 하나를 입력하세요. 사용한 코드는 다시 쓸 수 없습니다.</p>
        </div>
      </template>

      <!-- 오류는 카드 안 한 곳(role="alert")에만. 코드 틀림은 서버 조각, 일시 오류는 아래 템플릿. -->
      <div id="mfa-error" x-ref="error"></div>
      <template x-if="transient">
        <div class="banner banner--danger banner--top" role="alert">
          <span class="banner__icon"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="18"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 18h.01"/></svg></span>
          <div class="banner__body">
            <div class="banner__title">확인하지 못했습니다</div>
            <div x-text="transient + '. 잠시 후 다시 시도하세요.'"></div>
          </div>
        </div>
      </template>

      <template x-if="mode === 'totp'">
        <div class="col" style="gap: 20px;">
          <div x-on:input="syncOtp()" x-on:keydown="syncOtp()" x-on:otp-complete="syncOtp()" x-on:paste="syncOtp()" x-ref="otp">
            <fieldset class="otp-set" x-data="otpInput({&quot;length&quot;:6,&quot;submit&quot;:true})">
  <legend class="sr-only">인증 코드 6자리</legend>
  <input name="code" type="hidden" x-bind:value="value">
  <div class="otp">
    <input aria-label="인증 코드 1번째 자리" autocomplete="one-time-code" autofocus="autofocus"
           class="otp__cell" inputmode="numeric"
           maxlength="1" x-on:focus="$event.target.select()" x-on:input="onInput(0, $event)"
           x-on:keydown="onKeydown(0, $event)" x-on:paste="onPaste($event)"><input aria-label="인증 코드 2번째 자리" autocomplete="off" class="otp__cell"
           inputmode="numeric" maxlength="1"
           x-on:focus="$event.target.select()" x-on:input="onInput(1, $event)" x-on:keydown="onKeydown(1, $event)"
           x-on:paste="onPaste($event)"><input aria-label="인증 코드 3번째 자리" autocomplete="off" class="otp__cell"
           inputmode="numeric" maxlength="1"
           x-on:focus="$event.target.select()" x-on:input="onInput(2, $event)" x-on:keydown="onKeydown(2, $event)"
           x-on:paste="onPaste($event)"><input aria-label="인증 코드 4번째 자리" autocomplete="off" class="otp__cell"
           inputmode="numeric" maxlength="1"
           x-on:focus="$event.target.select()" x-on:input="onInput(3, $event)" x-on:keydown="onKeydown(3, $event)"
           x-on:paste="onPaste($event)"><input aria-label="인증 코드 5번째 자리" autocomplete="off" class="otp__cell"
           inputmode="numeric" maxlength="1"
           x-on:focus="$event.target.select()" x-on:input="onInput(4, $event)" x-on:keydown="onKeydown(4, $event)"
           x-on:paste="onPaste($event)"><input aria-label="인증 코드 6번째 자리" autocomplete="off" class="otp__cell"
           inputmode="numeric" maxlength="1"
           x-on:focus="$event.target.select()" x-on:input="onInput(5, $event)" x-on:keydown="onKeydown(5, $event)"
           x-on:paste="onPaste($event)">
  </div>
</fieldset>
            <p class="hint" style="text-align: center;">붙여넣기 지원 · 6자리를 모두 입력하면 자동 확인</p>
          </div>
          <button class="btn btn--primary btn--lg" type="submit" x-bind:disabled="submitting || !ready" x-text="submitting ? '확인 중…' : '확인'">확인</button>
          <div class="col" style="gap: 6px; align-items: center; padding-top: 4px; border-top: 1px solid var(--line-soft);">
            <button class="btn btn--ghost btn--sm" type="button" x-bind:disabled="submitting" x-on:click="switchMode('recovery')">복구 코드로 로그인</button>
            <p class="hint" style="margin: 0; text-align: center;">기기를 잃어버렸나요? 운영자에게 MFA 초기화를 요청하세요.</p>
            <p class="hint" style="margin: 0; text-align: center;" x-cloak x-show="wrongTotp">시계가 맞지 않으면 코드가 계속 틀릴 수 있습니다. 휴대폰 시간 자동 설정을 확인하세요.</p>
          </div>
        </div>
      </template>
      <template x-if="mode === 'recovery'">
        <div class="col" style="gap: 20px;">
          <div class="field">
            <label class="label" for="mfa-recovery">복구 코드</label>
            <input autocomplete="off" class="input input--lg mono" id="mfa-recovery" name="code" placeholder="AB3F-2K7M"
                   style="min-height: 48px; font-size: 16px; letter-spacing: 0.08em; text-align: center;"
                   x-bind:readonly="submitting" x-bind:value="code" x-on:input="onRecoveryInput($event)" x-ref="recovery">
          </div>
          <button class="btn btn--primary btn--lg" type="submit" x-bind:disabled="submitting || !ready" x-text="submitting ? '확인 중…' : '확인'">확인</button>
          <button class="btn btn--ghost btn--sm" type="button" x-bind:disabled="submitting" x-on:click="switchMode('totp')">← authenticator 코드로 돌아가기</button>
        </div>
      </template>
    </form>
    <!-- 출구: MFA 대기 세션을 끝내고 로그인 화면으로(POST /admin/logout, th:action 이 _csrf 를 넣는다). -->
    <form action="/admin/logout" method="post" style="margin: 0;"><input name="_csrf" type="hidden" value="{{CSRF}}"/>
      <button class="btn btn--ghost" style="color: var(--ink-2);" type="submit">← 로그인으로</button>
    </form>
  </div>
</main>

<!-- 코드 틀림(MfaController.verify 401) — LoginPageController 가 422 로 이 조각만 돌려준다. 전체 페이지에서는 mode 가 없어 그리지 않는다. -->

</body>
</html>
