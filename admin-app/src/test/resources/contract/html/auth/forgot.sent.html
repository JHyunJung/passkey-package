@status: 200
@contentType: text/html;charset=UTF-8

<div class="auth-card" id="auth-card">
      <div class="col" style="gap: 6px;">
        <h1 class="page__title">비밀번호 재설정</h1>
        <p class="card__sub">가입한 이메일을 입력하면 재설정 링크를 보내드립니다.</p>
        
      </div>
      
        <div class="banner banner--success banner--top" role="status">
          <span class="banner__icon"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24" width="18"><path d="M5 12l5 5L20 7"/></svg></span>
          <div class="banner__body">
            <div class="banner__title">메일을 확인하세요</div>
            <div>해당 이메일로 가입된 계정이 있으면 재설정 링크가 발송됩니다.</div>
          </div>
        </div>
        <p class="hint" style="margin: 0;">메일이 오지 않으면 스팸함을 확인하거나 플랫폼 운영자에게 문의하세요.</p>
      
      
    </div>
