# 배포용 앱 스택 — 서버 A / 서버 B / QA 가 이 파일 하나를 공유하고
# COMPOSE_PROFILES 와 .env 로 역할을 분기한다.
#
#   서버 A: COMPOSE_PROFILES=proxy,admin docker compose up -d --scale passkey-app=3
#   서버 B: COMPOSE_PROFILES=proxy       docker compose up -d --scale passkey-app=3
#   QA    : COMPOSE_PROFILES=proxy,admin,qa docker compose up -d
#
# DB(외부 Oracle)와 Redis(서버 C)는 이 스택 밖에 있다.
# 루트 docker-compose.yml 은 로컬 개발용(Oracle+Redis)이며 이 파일과 무관하다.

name: passkey-deploy

services:
  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"            # 443 으로 리다이렉트만 한다
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # 공식 이미지가 templates/ 의 파일을 envsubst 로 치환해
      # /etc/nginx/conf.d/ 에 생성한다.
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # TLS 인증서(fullchain.pem, key.pem). passkey·RP 두 FQDN 을 모두 포함해야 한다.
      - ./cert:/etc/nginx/cert:ro
    environment:
      PASSKEY_SERVER_NAME: ${PASSKEY_SERVER_NAME}
      RP_SERVER_NAME: ${RP_SERVER_NAME:-rp.invalid}
    depends_on:
      - passkey-app

  passkey-app:
    image: passkey-app:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    restart: unless-stopped
    # ports 매핑 없음 — nginx 가 compose 내부 네트워크로 접근한다.
    # 호스트 포트를 잡지 않아야 --scale 시 충돌이 나지 않는다.
    # nginx 를 빼고 호스트 nginx 를 쓸 경우에만 아래를 주석 해제한다
    # (단, 그 경우 --scale 은 1 로 제한된다).
    #ports:
    #  - "${PASSKEY_HOST_PORT:-8080}:8080"
    mem_limit: ${PASSKEY_MEM_LIMIT:-1g}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_RUNTIME_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_RUNTIME_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - PASSKEY_KEY_ENVELOPE_MASTER_KEY=${MASTER_KEY}
      - PASSKEY_ID_TOKEN_ISSUER_BASE=${ISSUER_BASE}
      # 기본값이 Dockerfile ENV JAVA_OPTS 와 두 곳에 중복 정의돼 있다 — 바꿀 때
      # 반드시 함께. compose 가 항상 주입하므로 이 경로에선 Dockerfile 값이 쓰이지 않는다.
      - JAVA_OPTS=${PASSKEY_JAVA_OPTS:--XX:MaxRAMPercentage=75}
      # 값 없는 리스트형 — .env/셸에 있을 때만 전달되고 없으면 키 자체가 빠진다
      # (compose config 에서 null). `${VAR:-}` 로 쓰면 빈 문자열이 전달돼 앱이
      # '설정됨' 으로 취급하므로 이 형태여야 한다. prometheus 스크레이프가
      # 필요한 배포만 .env 에서 켠다(기본은 core 의 health,info).
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  admin-app:
    profiles: ["admin"]
    image: admin-app:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    restart: unless-stopped
    deploy:
      replicas: 1        # 스케줄러 리스가 있어 늘려도 안전하나, 1개로 고정한다
    ports:
      # 내부망 전용 — 외부 노출 금지. 호스트 내부 IP 에만 바인딩한다.
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${ADMIN_HOST_PORT:-8081}:8081"
    mem_limit: ${ADMIN_MEM_LIMIT:-1g}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_ADMIN_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_ADMIN_PASSWORD}
      # Flyway 는 admin-app 에만 주입한다. passkey-app 에 주면 --scale 로 늘어난
      # 인스턴스들이 동시에 마이그레이션을 시도한다.
      - SPRING_FLYWAY_USER=${DB_OWNER_USER}
      - SPRING_FLYWAY_PASSWORD=${DB_OWNER_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # 서버 A·B 가 같은 값이어야 한다. 다르면 한쪽 암호화 데이터를
      # 다른 쪽이 복호화하지 못한다.
      - PASSKEY_KEY_ENVELOPE_MASTER_KEY=${MASTER_KEY}
      - PASSKEY_MDS_LEASE_HOLDER=${MDS_LEASE_HOLDER:-admin-a}
      - ADMIN_INVITE_BASE_URL=${ADMIN_INVITE_BASE_URL}
      # passkey-app 과 동일 값 — 두 앱 issuer 일치. admin-app 은 ID Token 을
      # 발급하지 않지만 core 스캔으로 IdTokenIssuer 빈이 뜨므로, 코드 기본값
      # (dev 도메인)이 아니라 이 배포의 실제 issuer 를 쥐고 있게 한다.
      # ISSUER_BASE 는 passkey-app·admin-app 양쪽 필수 — 비면 두 앱 모두
      # 기동을 거부한다(IdTokenIssuer 의 blank 가드, fail-fast).
      - PASSKEY_ID_TOKEN_ISSUER_BASE=${ISSUER_BASE}
      #
      # 기본값이 Dockerfile ENV JAVA_OPTS 와 두 곳에 중복 정의돼 있다 — 바꿀 때
      # 반드시 함께. compose 가 항상 주입하므로 이 경로에선 Dockerfile 값이 쓰이지 않는다.
      - JAVA_OPTS=${ADMIN_JAVA_OPTS:--XX:MaxRAMPercentage=75}
      #
      # 아래는 값 없는 리스트형 — .env/셸에 있을 때만 전달되고 없으면 키 자체가
      # 빠진다(compose config 에서 null). `${VAR:-}` 로 쓰면 빈 문자열이 전달돼
      # Boot 의 @ConditionalOnProperty(spring.mail.host) 가 활성화되고 mail
      # health 가 DOWN 이 된다.
      - SPRING_MAIL_HOST
      - SPRING_MAIL_PORT
      - SPRING_MAIL_USERNAME
      - SPRING_MAIL_PASSWORD
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
      - PASSKEY_MAIL_FROM
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  rp-app:
    profiles: ["qa"]     # prod 에서는 이 profile 을 지정하지 않아 기동되지 않는다
    image: rp-app:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    restart: unless-stopped
    mem_limit: ${RP_MEM_LIMIT:-1g}
    environment:
      SPRING_PROFILES_ACTIVE: ${RP_PROFILE:-qa}
      PASSKEY_BASE_URL: ${RP_PASSKEY_BASE_URL}
      PASSKEY_ISSUER_BASE: ${ISSUER_BASE}
      PASSKEY_API_KEY: ${RP_API_KEY}
      PASSKEY_TENANT_ID: ${RP_TENANT_ID}
      # 등록 relay 토큰 HMAC 키. rp-app 은 데모 기본값이면 부팅을 거부한다
      # (IllegalStateException: rp.relay.secret 이 데모 기본 키입니다).
      RP_RELAY_SECRET: ${RP_RELAY_SECRET}
      # cross-origin 웹 SPA 의 정확한 origin 목록(쉼표 구분). 비우면 빈 목록으로
      # 바인딩돼 CORS 가 비활성이다(같은-origin 만) — 와일드카드는 부팅 시 거부된다.
      RP_CORS_ALLOWED_ORIGINS: ${RP_CORS_ALLOWED_ORIGINS:-}
      # user↔handle↔credential 매핑 JSON. 아래 rp-data 볼륨에 두어 재기동 후에도 유지한다.
      RP_APP_USER_STORE_FILE: ${RP_APP_USER_STORE_FILE:-/app/data/rp-app-users.json}
      # 네이티브 앱 패스키용 Well-Known 값. 미설정 시 첨부 샘플 앱 기본값이며,
      # 아래 기본값은 rp-app/src/main/resources/application.yml 과 동일하게 유지한다.
      WK_ANDROID_PACKAGE: ${WK_ANDROID_PACKAGE:-com.crosscert.sample.passkey}
      WK_ANDROID_SHA256: ${WK_ANDROID_SHA256:-63:0C:F8:85:C6:9A:80:A0:87:B0:A2:72:83:61:00:29:F8:36:65:FF:EF:8E:FE:71:71:74:13:ED:34:9D:7C:54}
      WK_IOS_APPID: ${WK_IOS_APPID:-LTPC88ZFE8.com.crosscert.sample.passkey}
      # 기본값이 Dockerfile ENV JAVA_OPTS 와 두 곳에 중복 정의돼 있다 — 바꿀 때
      # 반드시 함께. compose 가 항상 주입하므로 이 경로에선 Dockerfile 값이 쓰이지 않는다.
      JAVA_OPTS: ${RP_JAVA_OPTS:--XX:MaxRAMPercentage=75}
    volumes:
      # user-store JSON 영속화. Dockerfile 이 /app/data 를 appuser 소유로 만들어 두므로
      # named volume 이 그 소유권을 이어받아 컨테이너가 쓸 수 있다.
      - rp-data:/app/data
    # healthcheck 없음 — rp-app 은 actuator 에 의존하지 않는다(build.gradle.kts 에
    # spring-boot-starter-actuator 미포함). /actuator/health 가 없으므로 passkey-app·
    # admin-app 과 같은 wget 프로브를 둘 수 없다. 데모용 단일 인스턴스라 무해하며,
    # 상태는 `docker compose ps` / 로그로 확인한다.

volumes:
  rp-data:
