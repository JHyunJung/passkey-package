# 이 nginx 가 TLS 를 직접 종료한다. 80 은 443 으로 리다이렉트만 하고,
# 443 에서 서브도메인 라우팅과 헤더 전달을 담당한다.
# 인증서는 deploy/cert/{fullchain,key}.pem — passkey·RP 두 FQDN 을 모두 포함해야 한다.
#
# WebAuthn rpId 는 도메인 기준으로 묶이고 포트를 무시하므로, passkey 서버와
# RP 서버를 포트가 아닌 서브도메인으로 분리해야 신뢰 경계가 명확해진다
# (docs/single-instance-deployment.md 참고).
#
# proxy_pass 에 호스트명을 직접 쓰지 않고 resolver + 변수를 쓰는 이유:
# 직접 쓰면 nginx 가 기동 시점에 DNS 를 해석해, 백엔드가 아직/이미 없으면
# 'host not found in upstream' 으로 nginx 자체가 뜨지 못한다(실측 확인).
# 변수를 쓰면 요청 시점에 해석되므로 백엔드 부재는 502 일 뿐 기동을 막지 않는다.

# conf.d 파일 최상위는 http 컨텍스트라 두 server 블록에 공통 적용된다.
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;

server {
    listen 80;
    server_name ${PASSKEY_SERVER_NAME} ${RP_SERVER_NAME};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PASSKEY_SERVER_NAME};

    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/key.pem;

    # 127.0.0.11 은 Docker 내장 DNS. valid=10s 로 재해석 주기를 짧게 두어
    # --scale 로 인스턴스가 늘거나 줄면 10초 내에 반영된다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # compose 서비스명. Docker DNS 가 --scale 로 뜬 N개 컨테이너 IP 전부로
    # 응답하므로, 스케일을 바꿔도 이 설정은 수정할 필요가 없다.
    set $passkey_upstream "passkey-app:8080";

    # actuator 는 운영 정보를 노출하므로 외부에 열지 않는다. core application-common.yml
    # 이 health,info 를 노출하고(prometheus 는 env 로만) health 는 show-details: always 다.
    # 차단 자체는 (3) 정규식 하나로 충분하다 — (1)·(2) 가 잡는 경로도 모두
    # 정규식에 포함된다(`/` 하위는 [/;] 의 '/', 인덱스 경로는 `$`). (1)·(2) 를
    # 남기는 것은 방어선 중첩이다: `=`·`^~` 는 매칭되는 순간 정규식 평가를 아예
    # 생략하는 빠른 경로이고, 무엇을 막는 규칙인지 한눈에 보이는 명시성도 있다.
    # 따라서 셋 중 하나를 지워도 차단은 유지되지만, 지우려면 (3) 이 아니라
    # (1)·(2) 쪽이어야 한다 — (3) 을 지우면 아래 경로 파라미터 우회가 뚫린다.
    #
    # (1) ^~ /actuator/  — 정상 하위 경로(/actuator/health 등).
    #     접두 location 은 파일 순서와 무관하게 '가장 긴 접두'가 이기므로 이 블록이
    #     location / 를 이긴다. ^~ 는 매칭 시 정규식 검사를 아예 건너뛰게 한다
    #     (정규식은 원래 접두보다 우선한다).
    # (2) = /actuator    — 인덱스 경로. (1) 은 슬래시가 붙은 경로만 잡아
    #     (1) 만 두고 (3) 까지 지우면 엔드포인트 목록(HAL)이 그대로
    #     프록시된다(실측 확인).
    # (3) 정규식         — 경로 파라미터 우회(/actuator;x/health). nginx 는 ';' 를
    #     경로의 일부로 보아 (1)·(2) 어디에도 걸리지 않지만, Spring MVC 의
    #     PathPattern 은 ';' 뒤(경로 파라미터)를 떼고 /actuator/health 로 매칭한다
    #     — 즉 nginx 는 통과시키고 앱은 실행한다(양쪽 실측 확인).
    #     %3B 도 nginx 가 location 매칭 전에 디코드하므로 같은 블록이 잡는다.
    #     [/;] 로 경계를 한정해 /actuatorfoo 는 과차단하지 않는다(실측 확인).
    #
    # compose healthcheck 는 컨테이너 안에서 localhost:8080 으로 직접 호출하므로
    # 이 차단의 영향을 받지 않는다(nginx 를 거치지 않는다).
    location ^~ /actuator/ {
        return 404;
    }

    location = /actuator {
        return 404;
    }

    location ~ "^/actuator([/;]|$)" {
        return 404;
    }

    location / {
        proxy_pass http://$passkey_upstream;
        proxy_set_header Host $host;
        # TLS 를 이 nginx 가 종료하므로 $scheme 이 곧 'https' 다. ($https 는
        # 'on'/'' 값이라 이 헤더에 쓰면 안 된다.) 앱은 이 값으로 리다이렉트 URL
        # 스킴·secure 쿠키를 판정한다. WebAuthn origin 검증은 이 헤더와 무관하다
        # (clientDataJSON 의 origin 을 테넌트 allowedOrigins 와 대조한다).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# --- QA 전용: rp-app. prod 에서는 rp-app 컨테이너가 뜨지 않으며,
# --- 지연 해석 덕분에 이 블록이 있어도 nginx 기동에 영향이 없다(502 반환).
# --- rp-app 은 /css·/js·/passkey/** 를 루트 절대경로로 쓰고 /.well-known/* 은
# --- 도메인 루트에 있어야 하므로, 경로 접두(/rp/)가 아니라 서브도메인으로 분리한다.
server {
    listen 443 ssl;
    http2 on;
    server_name ${RP_SERVER_NAME};

    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/key.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rp_upstream "rp-app:9090";

    location / {
        proxy_pass http://$rp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
