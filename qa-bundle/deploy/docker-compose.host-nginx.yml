# PROXY_MODE=host 전용 덧씌움 파일 — 서버에 이미 설치된 nginx 가 TLS 를 종료하고
# 아래 호스트 포트로 넘긴다. docker-compose.yml 위에 겹쳐 쓴다(start.sh 가 자동 지정).
#
#   COMPOSE_PROFILES=admin,qa docker compose \
#     -f docker-compose.yml -f docker-compose.host-nginx.yml up -d
#
# 번들 nginx(proxy profile)는 띄우지 않는다 — 호스트 nginx 와 80/443 이 충돌한다.
# admin-app 은 docker-compose.yml 에서 이미 ${ADMIN_BIND_ADDR}:${ADMIN_HOST_PORT} 로 열려 있다.
#
# 루프백에만 바인딩한다. 호스트 nginx 가 같은 서버에 있으므로 외부에 열 이유가 없다.
# 호스트 포트를 잡으므로 passkey-app 의 --scale 은 1 로 제한된다.
# 포트를 바꾸면 ./start.sh --nginx-conf 로 호스트 nginx 설정도 다시 만든다.

services:
  passkey-app:
    ports:
      - "${PASSKEY_BIND_ADDR:-127.0.0.1}:${PASSKEY_HOST_PORT:-8080}:8080"

  rp-app:
    ports:
      # 9090 은 Rocky 웹 콘솔(cockpit.socket)이 쓰는 경우가 있어 기본값으로 피한다.
      - "${RP_BIND_ADDR:-127.0.0.1}:${RP_HOST_PORT:-19090}:9090"
