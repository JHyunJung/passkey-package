# QA 서버 전용 — /data/deploy/nginx/nginx.conf
# ${…} 는 컨테이너 시작 시 .env 값으로 치환된다. 고친 뒤에는 restart 가 아니라 재생성:
#   docker compose up -d --force-recreate --no-deps nginx
#
#   https://${PASSKEY_SERVER_NAME}                    → passkey-app
#   https://${PASSKEY_SERVER_NAME}/admin/             → admin-app
#   https://${PASSKEY_SERVER_NAME}:${RP_PUBLIC_PORT}  → rp-app

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;

# Docker 내장 DNS. proxy_pass 에 변수를 써서 앱이 없어도 nginx 는 뜨게 한다(해당 요청만 502).
resolver 127.0.0.11 valid=10s ipv6=off;

# 모든 location 에 공통 적용된다. location 안에 proxy_set_header 를 추가하면 이 목록이
# 전부 빠지므로, 추가가 필요하면 여기에 넣는다.
# X-Forwarded-Port 가 없으면 RP(비표준 포트)의 /passkey/** 가 403 이 된다.
# 빈 값 4줄은 클라이언트가 위조해 보낸 헤더를 지운다.
proxy_set_header Host               $host;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Port   $server_port;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header Forwarded          "";
proxy_set_header X-Forwarded-Host   "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl    "";

server {
    listen 80;
    server_name ${PASSKEY_SERVER_NAME};
    return 301 https://$host$request_uri;
}

# passkey-app + admin-app(/admin)
server {
    listen 443 ssl;
    http2 on;
    server_name ${PASSKEY_SERVER_NAME};

    ssl_certificate     /etc/nginx/cert/${TLS_CERT_NAME};
    ssl_certificate_key /etc/nginx/cert/${TLS_KEY_NAME};

    set $passkey_upstream "passkey-app:8080";
    set $rp_upstream      "rp-app:9090";
    set $admin_upstream   "admin-app:8081";

    # actuator 외부 차단. 정규식은 ';' 우회(/actuator;x/health)를 막으므로 지우지 않는다.
    # admin-app 의 actuator 는 /admin 밖에 있어 아래 /admin 블록으로도 닿지 않는다.
    location ^~ /actuator/ {
        return 404;
    }

    location = /actuator {
        return 404;
    }

    location ~ "^/actuator([/;]|$)" {
        return 404;
    }

    # 네이티브 앱 패스키는 rpId 도메인의 443 에서 이 두 파일을 찾으므로 rp-app 으로 보낸다.
    location = /.well-known/assetlinks.json {
        proxy_pass http://$rp_upstream;
    }

    location = /.well-known/apple-app-site-association {
        proxy_pass http://$rp_upstream;
    }

    # admin 콘솔. 화면·API·로그인이 모두 /admin 아래에 있다.
    location /admin {
        proxy_pass http://$admin_upstream;
    }

    location / {
        proxy_pass http://$passkey_upstream;
    }
}

# rp-app (QA 데모)
server {
    listen ${RP_PUBLIC_PORT} ssl;
    http2 on;
    server_name ${PASSKEY_SERVER_NAME};

    ssl_certificate     /etc/nginx/cert/${TLS_CERT_NAME};
    ssl_certificate_key /etc/nginx/cert/${TLS_KEY_NAME};

    # https 포트에 http:// 로 들어오면 https 로 보낸다.
    error_page 497 =301 https://$host:$server_port$request_uri;

    set $rp_upstream "rp-app:9090";

    location / {
        proxy_pass http://$rp_upstream;
    }
}
