server:
  port: 9090
  # TLS 를 종료한 리버스 프록시(nginx)가 평문 http 로 넘기면, 이 설정이 없을 때 rp-app 은
  # 요청을 http://<host>:80 으로 본다. 브라우저는 같은 origin 이어도 POST 에 Origin
  # (https://<host>) 을 붙이므로 CorsFilter 가 cross-origin 으로 판정하고,
  # RP_CORS_ALLOWED_ORIGINS 가 빈 기본 배포에서는 /passkey/** 가 전부 403 이 된다.
  # framework 는 X-Forwarded-Proto/-Port 를 반영해 같은 origin 으로 판정하게 한다
  # (passkey-app·admin-app 과 같은 방식). 프록시가 없으면 헤더도 없어 no-op 이다.
  # ProxiedSameOriginPostTest 가 고정한다.
  forward-headers-strategy: framework

rp-app:
  # 재기동 후에도 확정 등록된 user↔handle↔credential 매핑을 유지하기 위한 JSON 파일.
  # 단일 인스턴스 데모용. 환경변수 RP_APP_USER_STORE_FILE 로 오버라이드 가능.
  user-store:
    file: ${RP_APP_USER_STORE_FILE:./data/rp-app-users.json}
  # 네이티브 앱 패스키용 Well-Known URI 값. 미설정 시 첨부 샘플 앱(com.crosscert.sample.passkey)
  # 으로 바로 동작한다. 고객사는 아래 환경변수만 자기 앱 값으로 교체하면 코드 수정 없이 재사용.
  well-known:
    android:
      - package-name: ${WK_ANDROID_PACKAGE:com.crosscert.sample.passkey}
        sha256-fingerprints:
          - ${WK_ANDROID_SHA256:63:0C:F8:85:C6:9A:80:A0:87:B0:A2:72:83:61:00:29:F8:36:65:FF:EF:8E:FE:71:71:74:13:ED:34:9D:7C:54}
    ios:
      app-ids:
        - ${WK_IOS_APPID:LTPC88ZFE8.com.crosscert.sample.passkey}

passkey:
  base-url:    ${PASSKEY_BASE_URL:http://localhost:8080}
  # passkey-app 발급 API Key(X-API-Key). 기동 시 1회 읽어 고정 사용하므로,
  # 키를 교체하려면 이 값을 바꾼 뒤 재기동한다(무중단 핫리로드는 지원하지 않음).
  api-key:     ${PASSKEY_API_KEY:}
  tenant-id:   ${PASSKEY_TENANT_ID:}
  # passkey-app 의 IdTokenIssuer 가 발급하는 iss prefix. passkey-app 의
  # passkey.id-token.issuer-base (코드 기본값 https://dev-passkey.crosscert.com) 와 일치해야 한다.
  # 로컬 데모에서는 passkey-app 을 아래처럼 띄워 이 값과 맞춘다(정본: docs/dev-setup.md §3.3).
  #   SPRING_PROFILES_ACTIVE=dev ./gradlew :passkey-app:bootRun \
  #     --args="--passkey.id-token.issuer-base=http://localhost:8080"
  # -D 는 Gradle 데몬 JVM 프로퍼티라 앱에 전달되지 않으므로 --args 를 쓴다.
  issuer-base: ${PASSKEY_ISSUER_BASE:http://localhost:8080}
  connect-timeout: 3s
  read-timeout: 10s
  jwks-cache-ttl: 5m

rp:
  relay:
    # 등록 relay 토큰 HMAC 서명 키. ⚠️ 운영은 환경변수로 강한 키 주입(미설정 시 데모 키 폴백).
    secret: ${RP_RELAY_SECRET:}
    ttl: 5m
  cors:
    # cross-origin 웹 SPA 의 정확한 origin 목록. 비면 CORS 비활성(같은-origin 데모만).
    # ⚠️ 와일드카드/reflected 금지. passkey-app tenant allowed-origins 와 일치시킬 것.
    allowed-origins: ${RP_CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    # 자식 로거(.sdk/.rpapp)는 이 부모 로거와 같은 레벨이므로 따로 두지 않는다.
    com.crosscert.passkey: INFO
    org.springframework.web: WARN
